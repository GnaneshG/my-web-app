<body>

  <div class="workspace">
    <aside class="sidebar" id="mainSidebar">

      <div class="brain-box">

  <input type="file" id="importFile" accept=".json" hidden onchange="importJSON(event)" />

  <script>
    const DEFAULT_LEXICON_AI_URL = 'https://tracker-reset.studiz.workers.dev/api/ai-lookup';
    const savedLexiconAIUrl = localStorage.getItem('cse_lexicon_engine_url');
    if (savedLexiconAIUrl === 'https://tracker.studiz.workers.dev/api/ai-lookup') {
      localStorage.setItem('cse_lexicon_engine_url', DEFAULT_LEXICON_AI_URL);
    }
    let SECURE_WORKER_URL = localStorage.getItem('cse_lexicon_engine_url') || DEFAULT_LEXICON_AI_URL;
    window.lexiconAIEndpoint = () => SECURE_WORKER_URL;

    const GS_CATEGORIES = [
      'GS-1: Society & Culture',
      'GS-1: History & Heritage',
      'GS-1: Geography & Society',
      'GS-2: Polity & Governance',
      'GS-2: Social Justice',
      'GS-2: International Relations',
      'GS-3: Economy & Dev',
      'GS-3: Agriculture',
      'GS-3: Environment & Ecology',
      'GS-3: Disaster Management',
      'GS-3: Science & Tech',
      'GS-3: Internal Security',
      'GS-4: Ethics & Integrity',
      'Essay & Editorial Idioms'
    ];

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeTamil(str) {
      const normalized = String(str || '')
        .replace(/[\u200B\uFEFF]/g, '')
        .replace(/\s+/g, ' ')
        .replace(/\s*([,;])\s*/g, '$1 ')
        .trim();
      return /^[-—–]+$/.test(normalized) ? '' : normalized;
    }

    function isLegacyGeneratedStudyText(value) {
      const text = String(value || '').toLowerCase();
      return text.includes('current-affairs context not supplied')
        || text.includes('no newspaper event is inferred')
        || text.startsWith('no dated source added yet');
    }

    function normalizeLexiconEntry(item, index, usedIds = new Set()) {
      if (!item || typeof item !== 'object' || Array.isArray(item)) return null;
      const categoryAliases = {
        'Polity & Governance': 'GS-2: Polity & Governance',
        'Economy': 'GS-3: Economy & Dev',
        'International Relations': 'GS-2: International Relations',
        'Environment': 'GS-3: Environment & Ecology',
        'Science & Tech': 'GS-3: Science & Tech',
        'Society': 'GS-1: Society & Culture',
        'Ethics': 'GS-4: Ethics & Integrity'
      };
      let cat = String(item.cat || 'Essay & Editorial Idioms');
      cat = categoryAliases[cat] || cat;
      if (!GS_CATEGORIES.includes(cat)) cat = 'Essay & Editorial Idioms';

      const savedNewspaperContext = String(item.ex1 || item.ex || '');
      const savedNewspaper = savedNewspaperContext && !isLegacyGeneratedStudyText(savedNewspaperContext)
        ? savedNewspaperContext : '';
      const savedMains = item.ex2 && !isLegacyGeneratedStudyText(item.ex2) ? String(item.ex2) : '';
      const savedPYQ = item.ex3 && !isLegacyGeneratedStudyText(item.ex3) ? String(item.ex3) : '';
      let id = item.id == null ? '' : String(item.id).trim();
      if (!id || usedIds.has(id)) id = `lex-${Date.now()}-${index}-${Math.random().toString(36).slice(2, 8)}`;
      while (usedIds.has(id)) id = `${id}-${Math.random().toString(36).slice(2, 6)}`;
      usedIds.add(id);

      const rawTamil = item.tamil || item.Tamil || item.tamilMeaning || item.tamil_meaning || item.tamilTranslation || item.tamil_translation || item.meaningTamil || item.meaning_ta || item.translation_ta || item.ta || '';
      return {
        id,
        words: String(item.words || 'Unnamed').trim() || 'Unnamed',
        pos: String(item.pos || '').trim(),
        tamil: normalizeTamil(rawTamil),
        tamilVerified: typeof item.tamilVerified === 'boolean' ? item.tamilVerified : null,
        tamilSource: String(item.tamilSource || ''),
        definitionSource: String(item.definitionSource || 'English dictionary'),
        nuance: normalizeTamil(item.nuance || ''),
        eng: String(item.eng || '').trim(),
        syn: String(item.syn || '—').trim() || '—',
        cat,
        starred: Boolean(item.starred),
        ex1: savedNewspaper,
        ex2: savedMains,
        ex3: savedPYQ
      };
    }

    function normalizeLexiconData(items) {
      const usedIds = new Set();
      return (Array.isArray(items) ? items : [])
        .map((item, index) => normalizeLexiconEntry(item, index, usedIds))
        .filter(Boolean);
    }

    function loadDatabase() {
      for (const key of ['cse_lexicon_v5', 'cse_lexicon_v4', 'upsc_vocab_v3', 'upsc_vocab_db']) {
        try {
          const raw = localStorage.getItem(key);
          if (raw === null) continue;
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return normalizeLexiconData(parsed);
        } catch (_) {}
      }
      return [];
    }

    var db = loadDatabase();
    var brain = {};
    try {
      brain = JSON.parse(localStorage.getItem('cse_brain_v5') || localStorage.getItem('cse_learned_brain') || '{}') || {};
    } catch (e) { brain = {}; }

    let lookupHistory = [];
    try {
      lookupHistory = JSON.parse(localStorage.getItem('cse_lookup_history_v1') || '[]');
    } catch (e) { lookupHistory = []; }

    let activeSearchSpotlightId = null;
    let aiSearchMatchIds = null;
    let aiSearchTimer = null;
    let aiSearchRequest = 0;

    let selectedGS = 'ALL';
    let selectedLetter = 'ALL';
    let groupMode = 'gs';
    let onlyStarred = false;
    let expandAll = false;

    const savedTheme = localStorage.getItem('cse_theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia?.('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change', event => {
      if (!localStorage.getItem('cse_theme')) {
        document.documentElement.setAttribute('data-theme', event.matches ? 'dark' : 'light');
      }
    });

    document.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        const search = document.getElementById('wordInput');
        search?.focus();
        search?.select();
      }
    });

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { el.style.display = 'none'; }, 4500);
    }

    function saveAll() {
      try {
        localStorage.setItem('cse_lexicon_v5', JSON.stringify(db));
        localStorage.setItem('cse_brain_v5', JSON.stringify(brain));
        localStorage.setItem('cse_lookup_history_v1', JSON.stringify(lookupHistory.slice(0, 25)));
      } catch (e) {
        console.warn('Storage quota warning:', e);
      }
    }

    window.addEventListener('message', event => {
      if (event.origin !== window.location.origin || event.source !== window.parent
          || event.data?.type !== 'tracker-lexicon-cloud-state') return;
      if (Array.isArray(event.data.lexicon)) db = normalizeLexiconData(event.data.lexicon);
      if (event.data.brain && typeof event.data.brain === 'object' && !Array.isArray(event.data.brain)) brain = event.data.brain;
      if (Array.isArray(event.data.history)) lookupHistory = event.data.history.filter(value => typeof value === 'string').slice(0, 25);
      render();
      updateLookupHistoryUI();
    });

    function learnFromContext(word, definition, synonyms, targetGS) {
      const stop = new Set(['about','above','after','again','against','among','because','before','being','below','between','both','could','during','other','ought','shall','should','since','state','their','there','these','thing','those','through','under','until','where','which','while','would','person','action','process','practice','system']);
      const text = `${word} ${definition} ${synonyms}`.toLowerCase().replace(/[^a-z\s]/g, ' ');
      const tokens = text.split(/\s+/).filter(w => w.length >= 5 && !stop.has(w));
      tokens.slice(0, 7).forEach(tk => {
        brain[tk] = targetGS;
      });
      saveAll();
    }

    async function classifyUPSC(word, def, syns) {
      try {
        const response = await fetchWithTimeout(SECURE_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            task: 'classify_subject',
            word,
            definition: def,
            synonyms: syns
          })
        }, 8000);
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.success && GS_CATEGORIES.includes(data.category)) return data.category;
      } catch (_) {}
      return classifyUPSCFallback(word, def, syns);
    }

    function classifyUPSCFallback(word, def, syns) {
      const text = `${word} ${def} ${syns}`.toLowerCase();
      const tokens = text.replace(/[^a-z\s]/g, ' ').split(/\s+/);
      const scores = {};

      tokens.forEach(tk => {
        if (brain[tk]) {
          scores[brain[tk]] = (scores[brain[tk]] || 0) + 3;
        }
      });

      const rules = {
        'GS-2: Polity & Governance': /constitution|parliament|judiciary|supreme court|fundamental rights|directive principles|federal|ordinance|legislation|statute|repeal|abrogate|quash|mandate|tribunal|amendment|autonomy|bureaucracy|devolution|panchayat|censure|prerogative|franchise|grievance|ombudsman|accountability|executive|coalition|sovereignty|secular|bicameral|promulgate|jurisdiction|litigation|impunity|despotism|oligarchy|plebiscite|referendum|filibuster|gerrymander|adjudicate/,
        'GS-3: Economy & Dev': /fiscal|monetary|inflation|stagflation|deflation|liquidity|tariff|subsidy|revenue|deficit|gdp|macroeconomic|austerity|recession|capital|credit|bond|equity|trade|supply chain|monopoly|cartel|amortization|insolvency|conglomerate|remittance|fdi|disinvestment|protectionism|arbitrage|collateral|devaluation|exchequer|agrarian|msme|yield|solvency|moratorium|duopoly|windfall|securitization/,
        'GS-2: International Relations': /bilateral|multilateral|geopolit|diplomacy|sovereign|treaty|accord|summit|hegemony|deterrence|sanction|envoy|belligerent|annexation|detente|rapprochement|diaspora|extradition|asylum|blockade|ceasefire|indo-pacific|global south|non-alignment|realpolitik|containment|pact|armistice|suzerainty|balkanization|imperialism|plenipotentiary|buffer state/,
        'GS-3: Environment & Ecology': /climate|carbon|biodiversity|ecology|emission|sequester|pollution|sustainable|conservation|habitat|endemic|biome|deforestation|afforestation|wetland|mangrove|anthropogenic|mitigation|adaptation|resilience|effluent|glacier|desertification|ecocide|rewilding|permafrost|decoupling|eutrophication|pelagic|riparian|cryosphere/,
        'GS-3: Science & Tech': /quantum|algorithm|cyber|encryption|biotech|genome|pathogen|semiconductor|nanotech|artificial intelligence|machine learning|blockchain|orbital|payload|nuclear|fission|fusion|indigenous|intellectual property|patent|spectrum|bandwidth|antimicrobial|crispr|deepfake|telemetry|cryptography|biometric|latency/,
        'GS-1: History & Heritage': /archaeology|heritage|civilization|dynasty|empire|inscription|monument|freedom struggle|national movement|colonial|renaissance|reform movement|medieval|ancient india|historical/,
        'GS-1: Geography & Society': /geography|monsoon|river basin|plateau|climate zone|population|urbanization|migration|demographic|settlement|resource distribution|regional disparity/,
        'GS-2: Social Justice': /social justice|welfare|inclusion|inclusive|poverty|healthcare|education|nutrition|vulnerable|marginalized|gender|sanitation|human development|inequality|empowerment/,
        'GS-3: Agriculture': /agriculture|agrarian|farmer|cropping|irrigation|agricultural|food security|food processing|minimum support price|crop insurance|soil health|fertilizer|farm income|horticulture|millet/,
        'GS-3: Disaster Management': /disaster|preparedness|early warning|earthquake|flood|cyclone|drought|landslide|resilience|mitigation|recovery|national disaster/,
        'GS-3: Internal Security': /internal security|terrorism|insurgency|left wing extremism|cybercrime|border security|radicalization|money laundering|organized crime|coastal security|smuggling|surveillance|encryption|naxal/,
        'GS-1: Society & Culture': /caste|patriarchy|kinship|demographic|urbanization|migration|secularism|communalism|regionalism|pluralism|marginalized|egalitarian|stratification|assimilation|sanskritization|subaltern|matriarch|syncretic|ethnocentrism|gentrification|fraternity|inequality|empowerment|endogamy|homogenization|parochial|ritual|religion|society/,
        'GS-4: Ethics & Integrity': /probity|integrity|altruism|empathy|compassion|conscience|moral|ethical|dilemma|impartiality|objectivity|non-partisanship|dedication|tolerance|virtue|utilitarian|deontology|rectitude|equanimity|fortitude|prudence|benevolence|magnanimity|scrupulous|corruption|nepotism|venality|mendacity|perfidy|altruistic/
      };

      for (const [gs, regex] of Object.entries(rules)) {
        const m = text.match(new RegExp(regex.source, 'g'));
        if (m) scores[gs] = (scores[gs] || 0) + m.length;
      }

      let best = 'Essay & Editorial Idioms';
      let max = 0;
      for (const [gs, sc] of Object.entries(scores)) {
        if (sc > max) { max = sc; best = gs; }
      }
      return best;
    }

    async function getUPSCPyqContext(word, pos, definition, gsCategory) {
      try {
        const response = await fetchWithTimeout(SECURE_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            task: 'upsc_pyq_glossary',
            word,
            pos,
            definition,
            category: gsCategory,
            instruction: `For the English UPSC glossary term "${word}" (${pos}, ${gsCategory}), return JSON with two concise, strictly factual fields: {"pyqPlacement": "How UPSC frames or tests this exact term in Prelims statements or Mains directives (2 concise sentences, without fabricating fake exam years or questions)", "glossaryRole": "Core conceptual meaning in ${gsCategory} standard textbooks/glossaries (1-2 concise sentences)"}.`
          })
        }, 9000);

        if (response.ok) {
          const data = await response.json().catch(() => ({}));
          let pyq = data?.pyqPlacement || data?.pyq || data?.ex3 || '';
          let glossary = data?.glossaryRole || data?.mainsRelevance || data?.ex2 || '';
          const rawText = data?.result || data?.text || data?.response || '';
          if ((!pyq || !glossary) && typeof rawText === 'string' && rawText.includes('{')) {
            try {
              const parsed = JSON.parse(rawText.replace(/^```(?:json)?\s*|\s*```$/gi, ''));
              pyq = pyq || parsed.pyqPlacement || parsed.pyq || '';
              glossary = glossary || parsed.glossaryRole || parsed.mainsRelevance || '';
            } catch (_) {}
          }
          if (pyq || glossary) {
            return {
              pyq: String(pyq).trim(),
              glossary: String(glossary).trim()
            };
          }
        }
      } catch (_) {}

      const subjectShort = gsCategory.replace(/^GS-\d:\s*/, '');
      const subjectTemplates = {
        'GS-2: Polity & Governance': {
          pyq: `In UPSC Prelims Polity statements, "${word}" appears when testing constitutional scope, statutory limits, or powers of executive/judicial bodies. In Mains GS-2, it is placed in questions evaluating institutional accountability, federalism, and legislative processes.`,
          glossary: `Standard Polity & Constitutional Law glossary term under ${subjectShort}: denotes the precise legal/procedural mechanism (${definition.split('|')[0].trim()}).`
        },
        'GS-3: Economy & Dev': {
          pyq: `In UPSC Prelims Economy MCQs, "${word}" is typically placed inside cause-and-effect statements testing RBI monetary tools, fiscal policy, or market behavior. In Mains GS-3, it anchors analytical questions on macroeconomic stability and growth.`,
          glossary: `Core Macroeconomics & Public Finance glossary entry (${subjectShort}): refers to ${definition.split('|')[0].trim()}.`
        },
        'GS-2: International Relations': {
          pyq: `In UPSC Prelims IR & Mapping questions, "${word}" appears in statements characterizing bilateral treaties, multilateral groupings, or diplomatic doctrines. In Mains GS-2, it frames questions on India's foreign policy choices and global governance.`,
          glossary: `Diplomatic & Geopolitical glossary term under ${subjectShort}: signifies ${definition.split('|')[0].trim()}.`
        },
        'GS-3: Environment & Ecology': {
          pyq: `In UPSC Prelims Environment questions, "${word}" is tested in concept-based statements on ecosystem processes, conservation frameworks, or climate conventions. In Mains GS-3, it is placed in questions on environmental impact assessment and mitigation.`,
          glossary: `Ecological & Climate Governance glossary entry (${subjectShort}): defines ${definition.split('|')[0].trim()}.`
        },
        'GS-3: Science & Tech': {
          pyq: `In UPSC Prelims Science & Tech MCQs, "${word}" is placed in application-oriented statements distinguishing emerging technologies, standards, or biological mechanisms. In Mains GS-3, it supports answers on indigenization and regulatory oversight.`,
          glossary: `Technical & Emerging Tech glossary term under ${subjectShort}: describes ${definition.split('|')[0].trim()}.`
        },
        'GS-4: Ethics & Integrity': {
          pyq: `In UPSC Mains GS-4 (Section A), "${word}" is directly asked as a foundational moral concept ("What do you understand by ${word} in public administration?"). In Section B case studies, it is placed as an administrative value to uphold during ethical dilemmas.`,

    async function fetchWithTimeout(url, options = {}, timeoutMs = 7000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function getSpellingCorrection(word) {
      try {
        const res = await fetchWithTimeout(
          `https://api.datamuse.com/sug?s=${encodeURIComponent(word)}&max=3`, {}, 4000
        );
        if (!res.ok) return null;
        const list = await res.json();
        const top = Array.isArray(list) ? list.find(item => item.word && !item.word.includes(' ')) : null;
        return top ? top.word : null;
      } catch (_) {
        return null;
      }
    }

    async function getTamilTranslation(word, definition = '', pos = '') {
      const isTamil = value => /[\u0B80-\u0BFF]/.test(String(value || ''));
      const term = String(word || '').trim();
      const cleanCandidate = value => normalizeTamil(String(value || '')
        .replace(/^\s*(?:tamil\s+(?:translation|meaning|nuance)|translation|தமிழ்\s*(?:மொழிபெயர்ப்பு|பொருள்))\s*[:：-]\s*/i, '')
        .replace(/^["“'‘]+|["”'’]+$/g, '')
        .replace(/[.!?]+$/g, ''));

      // 1. Primary: Google Translate single-term + dictionary part-of-speech list
      const googleUrls = [
        `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ta&dt=t&dt=bd&ie=UTF-8&oe=UTF-8&q=${encodeURIComponent(term)}`,
        pos ? `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ta&dt=t&ie=UTF-8&oe=UTF-8&q=${encodeURIComponent(`${term} (${pos})`)}` : null
      ].filter(Boolean);

      for (const url of googleUrls) {
        try {
          const response = await fetchWithTimeout(url, {}, 5000);
          if (!response.ok) continue;
          const data = await response.json();
          const primaryRaw = (data?.[0] || []).map(part => part?.[0] || '').join('');
          const cleanedPrimary = cleanCandidate(primaryRaw.replace(/\s*\([^)]*\)\s*$/, ''));

          const altTerms = [];
          if (Array.isArray(data?.[1])) {
            for (const group of data[1]) {
              if (Array.isArray(group?.[1])) {
                for (const alt of group[1]) {
                  const cleanAlt = cleanCandidate(alt);
                  if (isTamil(cleanAlt) && cleanAlt !== cleanedPrimary && !altTerms.includes(cleanAlt)) {
                    altTerms.push(cleanAlt);
                  }
                }
              }
            }
          }

          if (isTamil(cleanedPrimary)) {
            return {
              text: cleanedPrimary,
              nuance: altTerms.slice(0, 4).join(', '),
              source: 'Exact Tamil Dictionary'
            };
          }
        } catch (_) {}
      }

      // 2. Secondary: MyMemory Dictionary API
      try {
        const mmRes = await fetchWithTimeout(
          `https://api.mymemory.translated.net/get?q=${encodeURIComponent(term)}&langpair=en|ta`, {}, 5000
        );
        if (mmRes.ok) {
          const mmData = await mmRes.json();
          const mainMatch = cleanCandidate(mmData?.responseData?.translatedText || '');
          const matches = Array.isArray(mmData?.matches) ? mmData.matches : [];
          const alts = matches
            .map(m => cleanCandidate(m.translation))
            .filter(t => isTamil(t) && t !== mainMatch && t.length <= 60);
          const uniqueAlts = [...new Set(alts)];
          if (isTamil(mainMatch)) {
            return {
              text: mainMatch,
              nuance: uniqueAlts.slice(0, 3).join(', '),
              source: 'Tamil Dictionary Concordance'
            };
          }
        }
      } catch (_) {}

      // 3. Fallback: Configured AI Worker
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const response = await fetchWithTimeout(SECURE_WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              task: 'translate_en_ta',
              word: term,
              term,
              pos,
              definition,
              instruction: 'Translate the English UPSC glossary term into its exact formal Tamil dictionary word/phrase used in Tamil Nadu Government & UPSC Tamil glossaries. Return JSON with {"tamil": "exact Tamil term", "nuance": "1-3 exact Tamil dictionary synonyms"}.',
              sourceLanguage: 'en',
              targetLanguage: 'ta'
            })
          }, 10000);

          if (response.status === 503 && attempt === 0) {
            await new Promise(r => setTimeout(r, 1000));
            continue;
          }

          const data = await response.json().catch(() => ({}));
          let rawResult = data?.tamil || data?.translation || data?.translatedText || data?.result || '';
          let nuanceResult = data?.nuance || '';

          if (typeof rawResult === 'string' && rawResult.trim().startsWith('{')) {
            try {
              const parsed = JSON.parse(rawResult.replace(/^```(?:json)?\s*|\s*```$/gi, ''));
              rawResult = parsed.tamil || parsed.translation || rawResult;
              nuanceResult = parsed.nuance || nuanceResult;
            } catch (_) {}
          }

          const candidate = cleanCandidate(rawResult);
          const cleanedNuance = cleanCandidate(nuanceResult);
          if (response.ok && isTamil(candidate) && candidate.length <= 140) {
            return {
              text: candidate,
              nuance: isTamil(cleanedNuance) ? cleanedNuance : '',
              source: data.source || 'Tamil Glossary'
            };
          }
          return { text: '', nuance: '', source: '', error: data.error || `Translation service returned HTTP ${response.status}.` };
        } catch (_) {
          if (attempt === 1) {
            return { text: '', nuance: '', source: '', error: 'Could not reach the translation service.' };
          }
        }
      }
      return { text: '', nuance: '', source: '', error: 'Translation service unavailable.' };
    }

    async function retryTamilTranslation(event, id) {
      event.stopPropagation();
      const item = db.find(entry => String(entry.id) === String(id));

      item.tamilSource = result.source || 'Tamil Dictionary';
      saveAll();
      render();
      showToast('Exact Tamil dictionary translation added.');
    }

    function extractDictionaryApiEntry(entries, requestedWord) {
      if (!Array.isArray(entries)) return null;
      const collectedDefs = [];
      const collectedSyns = new Set();
      let primaryWord = requestedWord;
      let primaryPos = '';

      for (const entry of entries) {
        if (entry.word) primaryWord = entry.word;
        for (const meaning of entry.meanings || []) {
          if (!primaryPos && meaning.partOfSpeech) primaryPos = meaning.partOfSpeech;
          for (const syn of meaning.synonyms || []) {
            if (syn && /^[a-zA-Z\s-]+$/.test(syn)) collectedSyns.add(syn.trim());
          }
          for (const defObj of meaning.definitions || []) {
            if (typeof defObj.definition === 'string' && defObj.definition.trim() && collectedDefs.length < 2) {
              const prefix = (collectedDefs.length > 0 && meaning.partOfSpeech && meaning.partOfSpeech !== primaryPos)
                ? `(${meaning.partOfSpeech}) ` : '';
              collectedDefs.push(prefix + defObj.definition.trim());
            }
            for (const syn of defObj.synonyms || []) {
              if (syn && /^[a-zA-Z\s-]+$/.test(syn)) collectedSyns.add(syn.trim());
            }
          }
        }
      }

      if (!collectedDefs.length) return null;
      return {
        word: primaryWord,
        pos: primaryPos,
        definition: collectedDefs.join(' | '),
        synonyms: [...collectedSyns].slice(0, 8),
        source: 'English Dictionary'
      };
    }

    async function lookupDatamuseDefinition(word) {
      const response = await fetchWithTimeout(
        `https://api.datamuse.com/words?sp=${encodeURIComponent(word)}&md=dp&max=8`, {}, 6000
      );
      if (!response.ok) return null;
      const matches = await response.json();
      if (!Array.isArray(matches)) return null;
      const exactMatch = matches.find(item => String(item.word || '').toLowerCase() === word.toLowerCase());
      const rawDefs = Array.isArray(exactMatch?.defs) ? exactMatch.defs.filter(v => typeof v === 'string' && v.trim()) : [];
      if (!rawDefs.length) return null;

      let primaryPos = '';
      const cleanedDefs = rawDefs.slice(0, 2).map((raw, idx) => {
        const [posPart, ...rest] = raw.split('\t');
        const pos = rest.length ? posPart.trim() : '';
        if (idx === 0) primaryPos = pos;
        const text = (rest.length ? rest.join(' ') : posPart).trim();
        return (idx > 0 && pos && pos !== primaryPos) ? `(${pos}) ${text}` : text;
      });

      return {
        word: exactMatch.word,
        pos: primaryPos,
        definition: cleanedDefs.join(' | '),
        synonyms: [],
        source: 'English Dictionary'
      };
    }

    function extractWorkerDefinition(data, requestedWord) {
      const candidates = [
        data?.definition, data?.meaning, data?.eng, data?.text, data?.answer, data?.output_text,
        data?.result?.definition, data?.result?.meaning, data?.result?.text, data?.result,
        data?.response, data?.candidates?.[0]?.content?.parts?.map(part => part?.text || '').join(' ')
      ];
      for (const candidate of candidates) {
        if (typeof candidate !== 'string') continue;
        let text = candidate.trim().replace(/^```(?:json)?\s*|\s*```$/gi, '');
        let parsedObj = null;
        try {
          parsedObj = JSON.parse(text);
          text = parsedObj.definition || parsedObj.meaning || parsedObj.eng || '';
        } catch (_) {}
        if (text && text.length <= 600 && !/^\s*(?:error|not found)\b/i.test(text)) {
          return {
            word: requestedWord,
            pos: parsedObj?.pos || data?.partOfSpeech || data?.pos || '',
            definition: text,
            synonyms: Array.isArray(parsedObj?.synonyms) ? parsedObj.synonyms : (Array.isArray(data?.synonyms) ? data.synonyms : []),
            source: 'Glossary Dictionary'
          };
        }
      }
      return null;
    }

    async function lookupEnglishDefinition(word, isRetry = false) {
      let servicesResponded = false;

      // 1. Primary: Free Dictionary API
      try {
        const response = await fetchWithTimeout(
          `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`, {}, 7000
        );
        servicesResponded = true;
        if (response.ok) {
          const parsed = extractDictionaryApiEntry(await response.json(), word);
          if (parsed) return { entry: parsed, servicesResponded: true };
        }
      } catch (_) {}

      // 2. Secondary: Datamuse Definitions
      try {
        const parsed = await lookupDatamuseDefinition(word);
        servicesResponded = true;
        if (parsed) return { entry: parsed, servicesResponded: true };
      } catch (_) {}

      // 3. Auto-Spellcheck Retry
      if (!isRetry && !word.includes(' ')) {
        const corrected = await getSpellingCorrection(word);
        if (corrected && corrected.toLowerCase() !== word.toLowerCase()) {
          const retryResult = await lookupEnglishDefinition(corrected, true);
          if (retryResult.entry) {
            showToast(`Auto-corrected spelling: “${word}” ➔ “${corrected}”`);
            return retryResult;
          }
        }
      }

      // 4. Fallback: Configured AI Worker
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const response = await fetchWithTimeout(SECURE_WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ task: 'dictionary_definition', word, language: 'en', responseFormat: 'json' })
          }, 10000);
          servicesResponded = true;
          if (response.ok) {
            const parsed = extractWorkerDefinition(await response.json(), word);
            if (parsed) return { entry: parsed, servicesResponded: true };
            break;
          }
          if (response.status === 503 && attempt === 0) {
            await new Promise(r => setTimeout(r, 1000));
            continue;
          }
          break;
        } catch (_) {
          break;
        }
      }

      return { entry: null, servicesResponded };
    }

    async function processSingleTerm(rawTerm, customNote, overrideGS) {
      const cleanWord = String(rawTerm || '').trim().replace(/\s+/g, ' ');
      if (!cleanWord) return null;

      const existingByWord = db.find(item =>
        String(item.words || '').split(',').some(word =>
          word.trim().toLowerCase() === cleanWord.toLowerCase()
        )
      );
      if (existingByWord) {
        if (!existingByWord.tamil) {
          const tr = await getTamilTranslation(cleanWord, existingByWord.eng, existingByWord.pos);
          if (tr.text) {
            existingByWord.tamil = normalizeTamil(tr.text);
            if (tr.nuance) existingByWord.nuance = normalizeTamil(tr.nuance);
            existingByWord.tamilSource = tr.source;
          }
        }
        if (!existingByWord.ex3 || !existingByWord.ex2) {
          const pyqInfo = await getUPSCPyqContext(cleanWord, existingByWord.pos, existingByWord.eng, existingByWord.cat);
          if (!existingByWord.ex3) existingByWord.ex3 = pyqInfo.pyq;
          if (!existingByWord.ex2) existingByWord.ex2 = pyqInfo.glossary;
        }
        saveAll();
        return { status: 'EXISTS', item: existingByWord };
      }

      const lookup = await lookupEnglishDefinition(cleanWord);
      let entry = lookup.entry || null;
      let servicesResponded = Boolean(lookup.servicesResponded);
      let suggestions = [];

      if (!entry) {
        try {
          const suggestionResponse = await fetchWithTimeout(
            `https://api.datamuse.com/words?sp=${encodeURIComponent(cleanWord)}&max=5`, {}, 5000
          );
          servicesResponded = servicesResponded || suggestionResponse.ok;
          if (suggestionResponse.ok) {
            const data = await suggestionResponse.json();
            suggestions = Array.isArray(data) ? data.map(item => item.word).filter(Boolean).slice(0, 5) : [];
          }
        } catch (_) {}

        if (!servicesResponded) {
          showToast('Dictionary services could not be reached. Check your network connection.');
          return { status: 'ERROR' };
        }
        showToast(suggestions.length
          ? `No exact dictionary match for “${cleanWord}”. Did you mean: ${suggestions.join(', ')}?`
          : `No dictionary entry found for “${cleanWord}”. Verify spelling and try again.`);
        return { status: 'NOT_FOUND', suggestions };
      }

      const dictionaryWord = entry.word || cleanWord;
      const standardDefinition = String(entry.definition || '').trim();
      const partOfSpeech = entry.pos || '';
      const synonyms = Array.isArray(entry.synonyms) ? entry.synonyms : [];

      if (!standardDefinition) {
        showToast(`No definition available for “${dictionaryWord}”.`);
        return { status: 'NO_DEFINITION' };
      }

      const existingAfterCorrection = db.find(item =>
        String(item.words || '').split(',').some(word =>
          word.trim().toLowerCase() === dictionaryWord.toLowerCase()
        )
      );
      if (existingAfterCorrection) return { status: 'EXISTS', item: existingAfterCorrection };

      const synonymText = synonyms.slice(0, 8).join(', ');
      const detectedGS = (overrideGS && overrideGS !== 'AUTO')
        ? overrideGS
        : await classifyUPSC(dictionaryWord, standardDefinition, synonymText);

      const [translation, pyqContext] = await Promise.all([
        getTamilTranslation(dictionaryWord, standardDefinition, partOfSpeech),
        getUPSCPyqContext(dictionaryWord, partOfSpeech, standardDefinition, detectedGS)
      ]);

      const tamilAvailable = Boolean(translation.text);
      const tamilMeaning = tamilAvailable ? normalizeTamil(translation.text) : '';
      const tamilNuance = translation.nuance ? normalizeTamil(translation.nuance) : '';

      // Merge side-by-side if an existing entry in the same GS subject shares the exact Tamil meaning
      if (tamilMeaning) {
        const sameTamilEntry = db.find(item => normalizeTamil(item.tamil) === tamilMeaning && item.cat === detectedGS);
        if (sameTamilEntry) {
          const existingWords = sameTamilEntry.words.split(',').map(w => w.trim());
          if (!existingWords.some(w => w.toLowerCase() === dictionaryWord.toLowerCase())) {
            existingWords.push(dictionaryWord);
            sameTamilEntry.words = existingWords.join(', ');
            if (synonymText && sameTamilEntry.syn === '—') sameTamilEntry.syn = synonymText;
            if (!sameTamilEntry.ex3 && pyqContext.pyq) sameTamilEntry.ex3 = pyqContext.pyq;
            if (!sameTamilEntry.ex2 && pyqContext.glossary) sameTamilEntry.ex2 = pyqContext.glossary;
            saveAll();
          }
          return { status: 'MERGED', item: sameTamilEntry };
        }
      }

      const newItem = {
        id: crypto.randomUUID(),
        words: dictionaryWord,
        pos: partOfSpeech,
        tamil: tamilMeaning,
        tamilVerified: tamilAvailable,
        tamilSource: translation.source || 'Exact Tamil Dictionary',
        definitionSource: entry.source || 'English Dictionary',
        nuance: tamilNuance,
        eng: standardDefinition,
        syn: synonymText || '—',
        cat: detectedGS,
        starred: false,
        ex1: customNote || '',
        ex2: pyqContext.glossary || '',
        ex3: pyqContext.pyq || ''
      };

      db.push(newItem);
      learnFromContext(dictionaryWord, standardDefinition, synonymText, detectedGS);
      saveAll();
      return { status: tamilAvailable ? 'ADDED' : 'ADDED_PARTIAL', item: newItem };
    }

    async function submitWords() {
      const wInput = document.getElementById('wordInput');
      const gsSelect = document.getElementById('gsOverride');
      const btn = document.getElementById('submitBtn');

      const raw = wInput ? wInput.value.trim() : '';
      if (!raw) return;

      const list = [...new Set(raw.split(',').map(w => w.trim()).filter(Boolean))];
      if (btn) {
        btn.disabled = true;
        btn.textContent = list.length > 1 ? `Searching (${list.length})...` : 'Searching...';
      }

      let lastResult = null;
      const results = [];
      for (const w of list) {
        const res = await processSingleTerm(w, '', gsSelect ? gsSelect.value : 'AUTO');
        const resolvedWord = res?.item?.words?.split(',')[0]?.trim() || w;
        if (res?.item) {
          lookupHistory = [resolvedWord, ...lookupHistory.filter(h => h.toLowerCase() !== resolvedWord.toLowerCase())].slice(0, 25);
        }
        lastResult = res;
        results.push(res);
        saveAll();
      }
      updateLookupHistoryUI();

      if (list.length > 1) {
        const added = results.filter(r => r?.status === 'ADDED' || r?.status === 'ADDED_PARTIAL').length;
        const merged = results.filter(r => r?.status === 'MERGED').length;
        const existing = results.filter(r => r?.status === 'EXISTS').length;
        showToast(`Searched ${list.length} terms: ${added} added, ${merged} merged, ${existing} found in saved subjects.`);
      } else if (lastResult?.item) {
        activeSearchSpotlightId = lastResult.item.id;
        selectedGS = 'ALL';
        selectedLetter = 'ALL';
        if (lastResult.status === 'MERGED') {
          showToast(`Same Tamil dictionary meaning ("${lastResult.item.tamil}") — Merged under ${lastResult.item.cat}`);
        } else if (lastResult.status === 'EXISTS') {
          showToast(`Found “${lastResult.item.words}” (${lastResult.item.tamil}) under ${lastResult.item.cat}.`);
        } else if (lastResult.status === 'ADDED') {
          showToast(`Indexed “${lastResult.item.words}” (${lastResult.item.tamil}) under ${lastResult.item.cat}.`);
        }
      }

      if (wInput) {
        wInput.value = (list.length === 1 && lastResult?.item?.words)
          ? lastResult.item.words.split(',')[0].trim()
          : (list.length === 1 ? list[0] : raw);
      }
      if (btn) {
        btn.disabled = false;
        btn.textContent = '🔍 Search & Index';
      }
      render();
    }

    async function chainSynonym(e, synWord, parentGS) {
      e.stopPropagation();
      const clean = synWord.trim();
      if (!clean || clean === '—') return;
      showToast(`Looking up glossary synonym "${clean}"...`);
      const res = await processSingleTerm(clean, '', parentGS);
      if (res?.item) {
        lookupHistory = [clean, ...lookupHistory.filter(h => h.toLowerCase() !== clean.toLowerCase())].slice(0, 25);
        updateLookupHistoryUI();
        activeSearchSpotlightId = res.item.id;
        const wInput = document.getElementById('wordInput');
        if (wInput) wInput.value = clean;
      }
      if (res?.status === 'MERGED') {
        showToast(`Synonym "${clean}" shares Tamil meaning ("${res.item.tamil}") — Merged into ${res.item.words}`);
      } else if (res?.status === 'ADDED') {
        showToast(`Indexed synonym "${clean}" (${res.item.tamil}) under ${res.item.cat}`);
      } else if (res?.status === 'EXISTS') {
        showToast(`"${clean}" is saved under ${res.item.cat}.`);
      }
      render();
    }

    function editItem(e, id) {

      document.getElementById('editExample3').value = item.ex3 || '';
      const modal = document.getElementById('editModal');
      if (modal && typeof modal.showModal === 'function') {
        modal.showModal();
      }
    }

    function saveEditedItem(e) {
      e.preventDefault();
      const id = document.getElementById('editItemId').value;
      const item = db.find(entry => String(entry.id) === id);
      if (!item) return;

      const oldCategory = item.cat;
      const updatedTamil = normalizeTamil(document.getElementById('editTamil').value);
      if (updatedTamil && updatedTamil !== item.tamil) {
        item.tamilVerified = true;
        item.tamilSource = 'Verified Tamil Dictionary';
      }
      item.words = document.getElementById('editWords').value.trim() || item.words;
      item.pos = document.getElementById('editPos').value.trim();
      item.tamil = updatedTamil;
      item.nuance = normalizeTamil(document.getElementById('editNuance').value);
      item.cat = document.getElementById('editCategory').value;
      item.syn = document.getElementById('editSynonyms').value.trim() || '—';
      item.eng = document.getElementById('editDefinition').value.trim();
      item.ex1 = document.getElementById('editExample1').value.trim();
      item.ex2 = document.getElementById('editExample2').value.trim();
      item.ex3 = document.getElementById('editExample3').value.trim();

      if (oldCategory !== item.cat) {
        learnFromContext(item.words, item.eng, item.syn, item.cat);
      }
      saveAll();
      const modal = document.getElementById('editModal');
      if (modal && typeof modal.close === 'function') {
        modal.close();
      }
      showToast(`Saved changes to "${item.words}".`);
      render();
    }

    function changeGS(e, id, newGS) {
      e.stopPropagation();
      const target = db.find(i => String(i.id) === String(id));
      if (target) {
        target.cat = newGS;
        learnFromContext(target.words, target.eng, target.syn, newGS);
        saveAll();
        showToast(`Moved "${target.words}" to ${newGS}.`);
        render();
      }
    }

    function toggleStar(e, id) {
      e.stopPropagation();
      const target = db.find(i => String(i.id) === String(id));
      if (target) {
        target.starred = !target.starred;
        saveAll();
        render();
      }
    }

    function deleteRow(e, id) {
      e.stopPropagation();
      db = db.filter(i => String(i.id) !== String(id));
      if (activeSearchSpotlightId === id) activeSearchSpotlightId = null;
      saveAll();
      render();
    }

    function speakText(e, wordList) {
      e.stopPropagation();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(wordList).split(',')[0].trim());
        u.lang = 'en-IN';
        window.speechSynthesis.speak(u);
      }
    }

    function handleSearchInput() {
      clearTimeout(aiSearchTimer);
      aiSearchMatchIds = null;
      activeSearchSpotlightId = null;
      const query = document.getElementById('wordInput')?.value.trim() || '';
      if (query.length >= 2 && !query.includes(',')) {
        const requestId = ++aiSearchRequest;
        aiSearchTimer = setTimeout(async () => {
          try {
            const response = await fetchWithTimeout(SECURE_WORKER_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                task: 'word_search',
                query,
                entries: db.map(item => ({
                  id: item.id,
                  words: item.words,
                  category: item.cat,
                  definition: item.eng,
                  synonyms: item.syn,
                  tamil: item.tamil
                }))
              })
            }, 8000);
            const data = await response.json().catch(() => ({}));
            if (requestId === aiSearchRequest && response.ok && data.success && Array.isArray(data.ids)) {
              aiSearchMatchIds = new Set(data.ids);
              render();
            }
          } catch (_) {}
        }, 400);
      } else {
        aiSearchRequest++;
      }
      render();
    }

    function handleSummaryClick(e, articleEl) {
      if (window.getSelection().toString().length > 0) return;
      if (e.target.closest('button') || e.target.closest('select')) return;
      articleEl.classList.toggle('open');
    }

    function renderSidebarAndAZ() {
      const badge = document.getElementById('totalBadge');
      if (badge) badge.textContent = db.length;

      const counts = { ALL: db.length };
      GS_CATEGORIES.forEach(c => counts[c] = 0);
      db.forEach(i => { counts[i.cat] = (counts[i.cat] || 0) + 1; });

      const navContainer = document.getElementById('sidebarNav');
      if (navContainer) {
        const navHTML = [
          `<button class="nav-item ${selectedGS === 'ALL' ? 'active' : ''}" onclick="selectedGS='ALL';selectedLetter='ALL';activeSearchSpotlightId=null;render()">
            <span>All GS Subjects</span>
            <span class="nav-pill">${counts.ALL}</span>
          </button>`,
          ...GS_CATEGORIES.map(c => `
            <button class="nav-item ${selectedGS === c ? 'active' : ''}" onclick="selectedGS=${esc(inlineArg(c))};selectedLetter='ALL';activeSearchSpotlightId=null;render()">
              <span>${esc(c.replace('International Relations', 'Int. Relations').replace('Environment & Ecology', 'Environment'))}</span>
              <span class="nav-pill">${counts[c] || 0}</span>
            </button>`)
        ].join('');
        navContainer.innerHTML = navHTML;
      }

      const brainEntries = Object.entries(brain);
      const brainCountEl = document.getElementById('brainCount');
      if (brainCountEl) brainCountEl.textContent = `${brainEntries.length} Rules`;
      const brainPrev = document.getElementById('brainPreview');
      if (brainPrev) {
        brainPrev.innerHTML = brainEntries.slice(-12).reverse().map(([stem, gs]) =>
          `<span class="brain-chip" title="${esc(gs)}">${esc(stem)} ➔ ${esc(gs.split(':')[0])}</span>`
        ).join('') || `<span style="color:var(--ink-3); font-size:11px;">Search words to auto-classify by subject.</span>`;
      }

      const activeInitials = new Set(db.map(i => i.words.trim().charAt(0).toUpperCase()));
      const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
      const azBar = document.getElementById('azBar');
      if (azBar) {
        azBar.innerHTML = letters.map(l => {
          const has = l !== 'ALL' && activeInitials.has(l);
          return `<button class="az-btn ${selectedLetter === l ? 'active' : ''} ${has ? 'has-words' : ''}" onclick="selectedLetter='${l}';activeSearchSpotlightId=null;render()">${l}</button>`;
        }).join('');
      }
    }

    function inlineArg(value) {
      const escaped = String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'")
        .replace(/[\r\n\u2028\u2029]/g, char => ({ '\r': '\\r', '\n': '\\n', '\u2028': '\\u2028', '\u2029': '\\u2029' })[char]);
      return `'${escaped}'`;
    }

    function buildRowHTML(item, forceOpen = false) {
      const wordGroup = item.words.split(',').map(w => w.trim()).filter(Boolean);
      const mergeBadge = wordGroup.length > 1
        ? `<span class="w-merge-count" title="Merged English words sharing identical Tamil dictionary meaning">${wordGroup.length} Merged</span>`
        : '';

      const synList = (item.syn && item.syn !== '—' && item.syn !== '-')
        ? item.syn.split(',').map(s => s.trim()).filter(Boolean)
        : [];
      const cleanTamil = normalizeTamil(item.tamil);
      const hasTamilMeaning = Boolean(cleanTamil);
      const tamilLabel = 'Exact Tamil Dictionary';

      const synButtons = synList.length
        ? synList.map(s => `<button class="syn-clickable" onclick="chainSynonym(event, ${esc(inlineArg(s))}, ${esc(inlineArg(item.cat))})" title="Click to search & index glossary synonym '${esc(s)}'">+ ${esc(s)}</button>`).join('')
        : '';

      const drawerContent = [
        item.ex3 ? `<div class="ex-box"><div class="ex-head"><span>UPSC PYQ Placement</span><span>Prelims &amp; Mains</span></div><div class="ex-body">${esc(item.ex3)}</div></div>` : '',
        item.ex2 ? `<div class="ex-box"><div class="ex-head"><span>Glossary &amp; Subject Context</span><span>${esc(item.cat || 'GS')}</span></div><div class="ex-body">${esc(item.ex2)}</div></div>` : '',
        item.ex1 ? `<div class="ex-box"><div class="ex-head"><span>Editorial Reference</span><span>Note</span></div><div class="ex-body">${esc(item.ex1)}</div></div>` : '',
        synList.length ? `<div class="drawer-meta-grid" style="grid-column: 1 / -1; margin-top: 4px; margin-bottom: 0;"><div><div class="d-label">Glossary Synonyms (Click any to look up)</div><div>${synButtons}</div></div></div>` : ''
      ].filter(Boolean);

      const gsOptions = GS_CATEGORIES.map(c => {
        const short = c.replace(': Society & Culture', ' Society').replace(': History & Heritage', ' History').replace(': Geography & Society', ' Geography').replace(': Polity & Governance', ' Polity').replace(': Social Justice', ' Social Justice').replace(': International Relations', ' IR').replace(': Economy & Dev', ' Economy').replace(': Agriculture', ' Agriculture').replace(': Environment & Ecology', ' Env').replace(': Disaster Management', ' Disaster').replace(': Science & Tech', ' S&T').replace(': Internal Security', ' Security').replace(': Ethics & Integrity', ' Ethics').replace('Essay & Editorial Idioms', 'Essay');
        return `<option value="${esc(c)}" ${item.cat === c ? 'selected' : ''}>${esc(short)}</option>`;
      }).join('');

      const isOpen = expandAll || forceOpen || (activeSearchSpotlightId && String(item.id) === String(activeSearchSpotlightId));

      return `
        <div class="lex-item ${isOpen ? 'open' : ''}" onclick="handleSummaryClick(event, this)">
          <div class="lex-summary">
            <div class="lex-summary-top">
              <button class="star-btn ${item.starred ? 'starred' : ''}" onclick="toggleStar(event, ${esc(inlineArg(item.id))})" title="Mark High-Yield" aria-label="${item.starred ? 'Remove high-yield mark' : 'Mark as high-yield'}">★</button>

              <div class="c-word">
                <span class="w-main">${esc(item.words)}</span>
                ${mergeBadge}
                ${item.pos ? `<span class="w-pos">${esc(item.pos)}</span>` : ''}
                <button class="spk-icon" onclick="speakText(event, ${esc(inlineArg(item.words))})" title="Pronounce" aria-label="Pronounce ${esc(item.words)}">🔊</button>
              </div>
            </div>

            <div class="c-tamil-box ${hasTamilMeaning ? '' : 'is-empty'}" lang="ta">
              <div class="d-label">${hasTamilMeaning ? tamilLabel + (item.tamilSource ? ` · ${esc(item.tamilSource)}` : '') : 'Tamil meaning · not added yet'}</div>
              ${hasTamilMeaning
                ? `<div class="c-tamil">${esc(cleanTamil)}</div>${item.nuance ? `<span class="t-nuance">${esc(item.nuance)}</span>` : ''}`
                : `<div class="tamil-empty-state"><span>Fetch exact Tamil dictionary translation.</span><span class="tamil-empty-actions"><button type="button" class="tamil-add-btn" onclick="retryTamilTranslation(event, ${esc(inlineArg(item.id))})">✨ Get Tamil meaning</button><button type="button" class="tamil-add-btn tamil-manual-btn" onclick="editItem(event, ${esc(inlineArg(item.id))})">＋ Add manually</button></span><span class="tamil-translation-status" role="status" aria-live="polite"></span></div>`}
            </div>

            <div class="c-def"><div class="d-label">English Dictionary · ${esc(item.definitionSource || 'Dictionary')}</div><div class="c-def-text">${esc(item.eng)}</div></div>

            <div class="c-meta" onclick="event.stopPropagation()">
              <select class="gs-mini-select" onchange="changeGS(event, ${esc(inlineArg(item.id))}, this.value)" title="Move to another GS Subject" aria-label="Move ${esc(item.words)} to a GS subject">
                ${gsOptions}
              </select>
              <div class="meta-actions">
                <button class="edit-row-btn" onclick="editItem(event, ${esc(inlineArg(item.id))})" title="Edit glossary details">Edit</button>
                <button class="icon-del" onclick="deleteRow(event, ${esc(inlineArg(item.id))})" title="Delete" aria-label="Delete ${esc(item.words)}">✕</button>
              </div>
            </div>
          </div>

          ${drawerContent.length ? `<div class="lex-drawer" onclick="event.stopPropagation()"><div class="ex-trio">${drawerContent.join('')}</div></div>` : ''}
        </div>`;
    }

    function render() {
      renderSidebarAndAZ();

      const wordInputEl = document.getElementById('wordInput');
      const rawQ = wordInputEl ? wordInputEl.value.trim() : '';
      const q = rawQ.includes(',') ? '' : rawQ.toLowerCase();

      let filtered = db.filter(item => {
        const firstChar = item.words.trim().charAt(0).toUpperCase();
        const matchGS = selectedGS === 'ALL' || item.cat === selectedGS;
        const matchLet = selectedLetter === 'ALL' || firstChar === selectedLetter;
        const matchStar = !onlyStarred || item.starred;
        const matchQ = !q ||
          (aiSearchMatchIds && aiSearchMatchIds.has(String(item.id))) ||
          item.words.toLowerCase().includes(q) ||
          item.tamil.toLowerCase().includes(q) ||
          (item.nuance && item.nuance.toLowerCase().includes(q)) ||
          item.syn.toLowerCase().includes(q) ||
          item.eng.toLowerCase().includes(q);
        return matchGS && matchLet && matchStar && matchQ;
      });

      const body = document.getElementById('tableBody');
      const searchPanel = document.getElementById('searchResults');
      if (!body) return;

      if (q) {
        filtered.sort((a, b) => {
          const aWords = a.words.toLowerCase().split(',').map(w => w.trim());
          const bWords = b.words.toLowerCase().split(',').map(w => w.trim());
          const aExact = aWords.includes(q) ? 0 : (aWords.some(w => w.startsWith(q)) ? 1 : 2);
          const bExact = bWords.includes(q) ? 0 : (bWords.some(w => w.startsWith(q)) ? 1 : 2);
          return (aExact - bExact) || a.words.localeCompare(b.words);
        });

        if (searchPanel) {
          searchPanel.classList.add('active');
          if (!filtered.length) {
            searchPanel.innerHTML = `
              <div class="search-result-heading"><span>Search Lookup</span><span>Not yet indexed</span></div>
              <div style="padding:20px 16px; text-align:center; color:var(--ink-3); background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius);">
                <div style="font-weight:600; color:var(--ink-2); margin-bottom:4px;">Press <b>Enter</b> to look up “${esc(rawQ)}”</div>
                <div style="font-size:12.5px;">Fetches exact Tamil dictionary translation, UPSC PYQ placement, and assigns it to its GS subject.</div>
              </div>`;
          } else {
            searchPanel.innerHTML = `
              <div class="search-result-heading"><span>Dictionary &amp; UPSC PYQ Result for “${esc(rawQ)}”</span><span>${filtered.length} ${filtered.length === 1 ? 'entry' : 'entries'}</span></div>
              <div class="lex-grid-container">${filtered.map(item => buildRowHTML(item, true)).join('')}</div>`;
          }
        }
      } else if (searchPanel) {
        searchPanel.classList.remove('active');
        searchPanel.innerHTML = '';
      }

      // Always render previously searched & indexed words organized under their respective GS Subjects below
      const subjectList = db.filter(item => {
        const firstChar = item.words.trim().charAt(0).toUpperCase();
        const matchGS = selectedGS === 'ALL' || item.cat === selectedGS;
        const matchLet = selectedLetter === 'ALL' || firstChar === selectedLetter;
        const matchStar = !onlyStarred || item.starred;
        return matchGS && matchLet && matchStar;
      }).sort((a, b) => a.words.localeCompare(b.words));

      body.style.display = '';

      if (!subjectList.length) {
        body.innerHTML = `
          <div style="padding:44px 20px; text-align:center; color:var(--ink-3); background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius);">
            <div style="font-size:14px; font-weight:600; color:var(--ink-2); margin-bottom:6px;">No searched words in this subject yet.</div>
            <div style="font-size:13px;">Type any English word in the search bar above and press <b>Enter</b>, or click <b>⚡ Load UPSC Starter Terms</b>.</div>
          </div>`;
        return;
      }

      let html = '';
      GS_CATEGORIES.forEach(gs => {
        const subList = subjectList.filter(i => i.cat === gs);
        if (subList.length) {
          html += `<div class="section-divider"><span>${esc(gs)}</span><span>${subList.length} ${subList.length === 1 ? 'Searched Term' : 'Searched Terms'}</span></div>`;
          html += `<div class="lex-grid-container">` + subList.map(item => buildRowHTML(item)).join('') + `</div>`;
        }
      });
      body.innerHTML = html;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportCSV() {
      if (!db.length) return alert('Your lexicon is currently empty.');
      const sorted = [...db].sort((a, b) => a.cat.localeCompare(b.cat) || a.words.localeCompare(b.words));
      const headers = ['UPSC GS Subject', 'English Terms', 'Part of Speech', 'Exact Tamil Dictionary Meaning', 'Tamil Nuances', 'English Definition', 'Synonyms', 'Editorial Note', 'Glossary Context', 'UPSC PYQ Placement'];
      const rows = sorted.map(i => [
        i.cat, i.words, i.pos, i.tamil, i.nuance, i.eng, i.syn, i.ex1, i.ex2, i.ex3
      ].map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(','));
      const blob = new Blob(['\uFEFF' + [headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
      downloadBlob(blob, 'UPSC_CSE_Lexicon_Pro.csv');
    }

    function exportJSON() {
      const payload = { version: 5, exportedAt: new Date().toISOString(), db: normalizeLexiconData(db), brain };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      downloadBlob(blob, 'UPSC_Lexicon_Backup.json');
    }

    function importJSON(e) {
      const input = e.currentTarget;
      const file = input.files?.[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        alert('Backup file is too large (maximum 10 MB).');
        input.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (!data || typeof data !== 'object' || !Array.isArray(data.db)) {
            alert('Invalid backup file format.');
            return;
          }
          db = normalizeLexiconData(data.db);
          if (data.brain && typeof data.brain === 'object' && !Array.isArray(data.brain)) brain = data.brain;
          saveAll();
          showToast(`Restored ${db.length} valid terms and learned rules.`);
          render();
        } catch (err) {
          alert('Could not parse JSON backup file.');
        } finally {
          input.value = '';
        }
      };
      reader.onerror = function() {
        alert('Could not read the selected backup file.');
        input.value = '';
      };
      reader.readAsText(file);
    }

    render();
    updateLookupHistoryUI();
  </script>

  <!-- Firebase & Real-Time Cloud Sync Integration -->
  <script type="module">

    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { initializeFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-lexicon-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
    const trackerEmbedded = ['main', 'admin'].includes(new URLSearchParams(window.location.search).get('embed'));

    function sanitizeForFirestore(obj) {
      if (obj === undefined) return null;
      if (obj === null || typeof obj !== 'object') return obj;
      if (Array.isArray(obj)) {
        return obj.map(item => sanitizeForFirestore(item));
      }
      const sanitized = {};
      for (const key of Object.keys(obj)) {
        const val = obj[key];
        sanitized[key] = val === undefined ? null : sanitizeForFirestore(val);
      }
      return sanitized;
    }

    if (firebaseConfig && !trackerEmbedded) {
      const app = initializeApp(firebaseConfig);
      const dbInstance = initializeFirestore(app, {
        experimentalForceLongPolling: true,
        useFetchStreams: false
      });
      const auth = getAuth(app);

      const initAuth = async () => {
        try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        } catch (e) {
          await signInAnonymously(auth);
        }
      };

      initAuth().then(() => {
        onAuthStateChanged(auth, (user) => {
          if (!user) return;
          const userId = user.uid;
          const docRef = doc(dbInstance, 'artifacts', appId, 'users', userId, 'state', 'lexiconDocument');

          onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
              const cloudData = docSnap.data();
              if (Array.isArray(cloudData.db)) {
                window.db = typeof normalizeLexiconData === 'function' ? normalizeLexiconData(cloudData.db) : cloudData.db;
                if (cloudData.brain) window.brain = { ...window.brain, ...cloudData.brain };
                localStorage.setItem('cse_lexicon_v5', JSON.stringify(window.db));
                localStorage.setItem('cse_brain_v5', JSON.stringify(window.brain));
                if (typeof render === 'function') render();
              }
            } else {
              const cleanDb = sanitizeForFirestore(window.db);
              const cleanBrain = sanitizeForFirestore(window.brain);
              setDoc(docRef, { db: cleanDb, brain: cleanBrain, updatedAt: new Date().toISOString() }, { merge: true }).catch(() => {});
            }
          }, (error) => {
            console.debug('Cloud sync snapshot note:', error);
          });

          window._originalSaveAll = window.saveAll;
          window.saveAll = function() {
            if (window._originalSaveAll) window._originalSaveAll();
            if (!auth.currentUser) return;
            const cleanDb = sanitizeForFirestore(window.db);
            const cleanBrain = sanitizeForFirestore(window.brain);
            setDoc(docRef, {
              db: cleanDb,
              brain: cleanBrain,
              updatedAt: new Date().toISOString()
            }, { merge: true }).catch(err => console.warn('Cloud sync error:', err));
          };
        });
      });
    }
  </script>

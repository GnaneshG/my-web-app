<!DOCTYPE html>
<html lang="ta" data-theme="light">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEXICON PRO — UPSC-CSE Editorial & Tamil Concordance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Tamil:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #f4f4f0;
      --bg-panel: #ffffff;
      --bg-subtle: #ebeae4;
      --bg-hover: #f9f9f6;
      --ink-1: #0f172a;
      --ink-2: #334155;
      --ink-3: #64748b;
      --border: #e2e0d8;
      --border-strong: #cbd5e1;
      --brand: #1e3a8a;
      --brand-soft: #dbeafe;
      --tamil: #065f46;
      --tamil-soft: #d1fae5;
      --gold: #b45309;
      --gold-soft: #fef3c7;
      --danger: #dc2626;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --radius: 6px;
    }

    [data-theme="dark"] {
      --bg-app: #090d16;
      --bg-panel: #111827;
      --bg-subtle: #1e293b;
      --bg-hover: #172033;
      --ink-1: #f8fafc;
      --ink-2: #cbd5e1;
      --ink-3: #94a3b8;
      --border: #1e293b;
      --border-strong: #334155;
      --brand: #60a5fa;
      --brand-soft: rgba(59, 130, 246, 0.15);
      --tamil: #34d399;
      --tamil-soft: rgba(16, 185, 129, 0.15);
      --gold: #fbbf24;
      --gold-soft: rgba(245, 158, 11, 0.15);
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: text; }
    body {
      background: var(--bg-app);
      color: var(--ink-1);
      font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', -apple-system, sans-serif;
      font-size: 13.5px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-strong);
      box-shadow: var(--shadow-sm);
    }
    .topbar-inner {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-group { display: flex; align-items: baseline; gap: 12px; }
    .brand-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: var(--ink-1);
    }
    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 2px 8px;
      background: var(--brand-soft);
      color: var(--brand);
      border-radius: 4px;
      font-weight: 600;
    }

    .action-cluster { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .back-site-btn { min-height: 34px; color: var(--brand); text-decoration: none; white-space: nowrap; }
    .back-site-btn:hover { border-color: var(--brand); background: var(--brand-soft); }
    .btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: var(--bg-panel);
      color: var(--ink-2);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.14s ease;
    }
    .btn:hover { background: var(--bg-subtle); color: var(--ink-1); }
    .btn.active { background: var(--ink-1); color: var(--bg-panel); border-color: var(--ink-1); }
    .btn-primary {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
      padding: 8px 18px;
      font-size: 13px;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:disabled { opacity: 0.55; cursor: wait; }

    .workspace {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 20px 24px 60px 24px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1024px) {
      .workspace { grid-template-columns: 1fr; padding: 12px; }
    }

    .sidebar {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      position: sticky;
      top: 72px;
    }
    @media (max-width: 1024px) {
      .sidebar { position: static; }
    }
    .side-heading {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--ink-3);
      margin: 8px 0 6px 4px;
      display: flex;
      justify-content: space-between;
    }
    .nav-list { display: flex; flex-direction: column; gap: 3px; }
    @media (max-width: 1024px) {
      .nav-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    }
    .nav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      border-radius: 5px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-2);
      cursor: pointer;
      border: none;
      background: transparent;
      text-align: left;
      white-space: nowrap;
      gap: 8px;
    }
    .nav-item:hover { background: var(--bg-subtle); color: var(--ink-1); }
    .nav-item.active {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 700;
    }
    .nav-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 99px;
      background: var(--bg-subtle);
      color: var(--ink-3);
    }
    .nav-item.active .nav-pill { background: var(--brand); color: #fff; }

    .brain-box {
      margin-top: 16px;
      padding: 12px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
    }
    .brain-title {
      font-weight: 700;
      color: var(--ink-1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .brain-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
      max-height: 110px;
      overflow-y: auto;
    }
    .brain-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--ink-2);
    }

    .main-stage { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

    .console-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }
    .input-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1.2fr) minmax(190px, 1fr) minmax(110px, auto) minmax(150px, auto);
      gap: 12px;
      align-items: stretch;
    }
    .input-grid > * { min-width: 0; }
    .input-grid button { justify-content: center; white-space: normal; }

    input, select {
      width: 100%;
      padding: 9px 12px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--ink-1);
      background: var(--bg-app);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      border-color: var(--brand);
      background: var(--bg-panel);
    }

    .az-ribbon {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .az-ribbon::-webkit-scrollbar { display: none; }
    .az-btn {
      min-width: 28px;
      height: 25px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--ink-3);
      cursor: pointer;
    }
    .az-btn:hover { background: var(--bg-subtle); color: var(--ink-1); }
    .az-btn.active { background: var(--ink-1); color: var(--bg-panel); }
    .az-btn.has-words { color: var(--brand); font-weight: 700; }
    .az-btn.active.has-words { color: var(--bg-panel); }

    #toastBanner {
      display: none;
      margin-top: 8px;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--tamil-soft);
      color: var(--tamil);
      border-left: 3px solid var(--tamil);
    }

    /* Focused search results stay immediately below the search controls. */
    #searchResults { display: none; margin: 12px 0 18px; }
    #searchResults.active { display: block; }
    #searchResults .search-result-heading {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 12px; margin-bottom: 10px; border: 1px solid var(--border);
      border-left: 3px solid var(--brand); border-radius: var(--radius);
      background: var(--bg-panel); color: var(--ink-2); font-size: 11px;
      font-family: 'JetBrains Mono', monospace; text-transform: uppercase;
    }
    #searchResults .lex-grid-container { grid-template-columns: minmax(0, 1fr); }
    #searchResults .lex-item { border-color: var(--brand); box-shadow: var(--shadow-sm); }
    #searchResults .lex-item.open .lex-drawer { display: block; }
    #searchResults .c-tamil-box { padding: 12px 14px; }
    #searchResults .c-tamil { font-size: 20px; line-height: 1.8; }
    #searchResults .c-def { display: block; overflow: visible; -webkit-line-clamp: unset; }
    #searchResults .ex-trio { display: grid; grid-template-columns: 1fr; gap: 9px; }

    .table-box {
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: visible;
    }
    .col-headers {
      display: none;
    }

    .section-divider {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--brand);
      border-radius: var(--radius);
      margin: 16px 0 10px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lex-grid-container {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 1200px) {
      .lex-grid-container { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 768px) {
      .lex-grid-container { grid-template-columns: 1fr; }
    }

    .lex-item {
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .lex-item:hover { border-color: var(--brand); transform: translateY(-1px); }

    .lex-summary {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }

    .lex-summary-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .star-btn {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 15px;
      color: var(--border-strong);
      line-height: 1;
    }
    .star-btn.starred { color: var(--gold); }

    .c-word { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; flex: 1; }
    .w-main {
      font-weight: 700;
      font-size: 15px;
      color: var(--ink-1);
    }
    .w-merge-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--gold-soft);
      color: var(--gold);
      font-weight: 600;
    }
    .w-pos {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-size: 12.5px;
      color: var(--ink-3);
    }
    .spk-icon {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 12px;
      color: var(--ink-3);
      padding: 0 3px;
    }
    .spk-icon:hover { color: var(--brand); }

    .c-tamil-box {
      padding: 6px 10px;
      background: var(--tamil-soft);
      border-radius: 4px;
      border-left: 3px solid var(--tamil);
    }
    .c-tamil {
      font-family: 'Noto Sans Tamil', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      color: var(--tamil);
    }
    .t-nuance {
      font-weight: 400;
      font-size: 11.5px;
      color: var(--ink-2);
      display: block;
      margin-top: 2px;
    }

    body.recall-active .c-tamil-box,
    body.recall-active .c-def {
      filter: blur(5px);
      user-select: none;
      transition: filter 0.15s;
    }
    body.recall-active .lex-item:hover .c-tamil-box,
    body.recall-active .lex-item:hover .c-def,
    body.recall-active .lex-item.open .c-tamil-box,
    body.recall-active .lex-item.open .c-def {
      filter: none;
    }

    .c-def {
      font-size: 12.5px;
      color: var(--ink-2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .c-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      margin-top: 2px;
    }
    .gs-mini-select {
      padding: 3px 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
      background: var(--bg-app);
      color: var(--ink-2);
      width: auto;
      max-width: 140px;
      cursor: pointer;
    }
    .meta-actions { display: flex; align-items: center; gap: 4px; }
    .edit-row-btn {
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--bg-panel);
      color: var(--brand);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
    }
    .edit-row-btn:hover { background: var(--brand-soft); }
    .icon-del {
      border: none;
      background: none;
      color: var(--ink-3);
      cursor: pointer;
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 3px;
    }
    .icon-del:hover { color: var(--danger); background: rgba(220, 38, 38, 0.08); }

    .lex-drawer {
      display: none;
      padding: 14px;
      background: var(--bg-app);
      border-top: 1px dashed var(--border-strong);
    }
    .lex-item.open .lex-drawer { display: block; }
    .lex-item.open .c-def { display: block; overflow: visible; -webkit-line-clamp: unset; }

    .drawer-meta-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    @media (max-width: 760px) { .drawer-meta-grid { grid-template-columns: 1fr; } }

    .d-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--ink-3);
      margin-bottom: 4px;
    }
    .syn-clickable {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 9px;
      margin: 0 4px 4px 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--brand);
      cursor: pointer;
      transition: all 0.12s;
    }
    .syn-clickable:hover {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .ex-trio {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .ex-box {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--brand);
      padding: 10px 12px;
      border-radius: 4px;
    }
    .ex-box:nth-child(2) { border-left-color: var(--tamil); }
    .ex-box:nth-child(3) { border-left-color: var(--gold); }

    .ex-head {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .ex-body {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--ink-1);
      word-break: break-word;
    }
    .c-word, .c-tamil, .c-def, .drawer-meta-grid, .ex-box { cursor: text; }

    .edit-modal {
      width: min(720px, calc(100% - 28px));
      max-height: min(90vh, 900px);
      padding: 0;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      background: var(--bg-panel);
      color: var(--ink-1);
      box-shadow: 0 24px 80px rgba(15, 23, 42, .3);
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      display: none;
      z-index: 1000;
      overflow-y: auto;
    }
    .edit-modal[open] {
      display: block;
    }
    .edit-modal::backdrop { background: rgba(15, 23, 42, .58); backdrop-filter: blur(3px); }
    .edit-modal-inner { padding: 24px; }
    .edit-modal h2 { margin-bottom: 6px; font-size: 22px; }
    .edit-modal p { margin-bottom: 18px; color: var(--ink-3); }
    .edit-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .edit-form-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
    .edit-form-grid .wide { grid-column: 1 / -1; }
    .edit-form-grid textarea {
      width: 100%;
      min-height: 100px;
      padding: 11px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      background: var(--bg-app);
      color: var(--ink-1);
      font: inherit;
      line-height: 1.55;
      resize: vertical;
    }
    .edit-form-grid textarea:focus { border-color: var(--brand); background: var(--bg-panel); outline: none; }
    .edit-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <span class="brand-title" id="pageMainTitle">The CSE Lexicon</span>
        <span class="brand-tag" id="pageSubtitle">GS-I to GS-IV Concordance</span>
      </div>
      <div class="action-cluster" id="mainHeaderActions">
        <a class="btn back-site-btn" id="back-to-website" href="./index.html" aria-label="Return to the main website">← Back to Website</a>
        <button class="btn active" id="btnViewGS" onclick="setGrouping('gs')">📂 GS Syllabus</button>
        <button class="btn" id="btnViewAZ" onclick="setGrouping('az')">🔤 A–Z Index</button>
        <button class="btn" id="btnStarFilter" onclick="toggleStarFilter()">★ High-Yield Only</button>
        <button class="btn" id="btnRecall" onclick="toggleRecallMode()">🎯 Active Recall</button>
        <button class="btn" id="btnExpandAll" onclick="toggleExpandAll()">↕️ Expand All</button>
        <button class="btn" id="btnToggleAdmin" onclick="toggleAdminPortal()">⚙️ Admin Portal</button>
        <button class="btn" id="btnThemeMain" onclick="toggleTheme()" title="Switch Theme">🌗</button>
      </div>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="mainSidebar">
      <div class="side-heading">
        <span id="sidebarHeaderTitle">UPSC GS Syllabus</span>
        <span id="totalBadge">0</span>
      </div>
      <div class="nav-list" id="sidebarNav"></div>

      <div class="brain-box">
        <div class="brain-title">
          <span>🧠 Adaptive GS Brain</span>
          <span id="brainCount" style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--brand);">0 Rules</span>
        </div>
        <div style="color:var(--ink-3); font-size:11.5px; line-height:1.4;">
          Automatically learns domain stems from UPSC PYQ trends, The Hindu & Indian Express editorials.
        </div>
        <div class="brain-tags" id="brainPreview"></div>
      </div>

      <div style="margin-top:12px; display:flex; gap:6px;">
        <button class="btn" style="width:100%; justify-content:center;" onclick="loadStarterPack()">⚡ Load UPSC Starter Terms</button>
      </div>
    </aside>

    <main class="main-stage" id="mainStageArea">
      <section class="console-card">
        <div class="input-grid" style="grid-template-columns: minmax(0, 1.8fr) minmax(190px, 1fr) minmax(110px, auto);">

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeTamil(str) {
      return String(str || '')
        .replace(/[\u200B-\u200D\uFEFF]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function isLegacyGeneratedStudyText(value) {
      const text = String(value || '').toLowerCase();
      return /^(the hindu|the indian express|pib|economic survey|editorial focus|gs-\d|essay & ethics way forward|gs-\d+\/mains integration)/i.test(text)
        || text.includes('recent reporting examines')
        || text.includes('coverage connects')
        || text.includes('public policy discussion considers')
        || text.includes('geopolitical commentaries suggest');
    }

    function loadDatabase() {
      const raw = localStorage.getItem('cse_lexicon_v5')
        || localStorage.getItem('cse_lexicon_v4')
        || localStorage.getItem('upsc_vocab_v3')
        || localStorage.getItem('upsc_vocab_db')
        || '[]';
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.map(item => {
          let cat = item.cat || 'Essay & Editorial Idioms';
          if (cat === 'Polity & Governance') cat = 'GS-2: Polity & Governance';
          else if (cat === 'Economy') cat = 'GS-3: Economy & Dev';
          else if (cat === 'International Relations') cat = 'GS-2: International Relations';
          else if (cat === 'Environment') cat = 'GS-3: Environment & Ecology';
          else if (cat === 'Science & Tech') cat = 'GS-3: Science & Tech';
          else if (cat === 'Society') cat = 'GS-1: Society & Culture';
          else if (cat === 'Ethics') cat = 'GS-4: Ethics & Integrity';
          else if (!GS_CATEGORIES.includes(cat)) cat = 'Essay & Editorial Idioms';

          const savedNewspaperContext = item.ex1 || item.ex || '';
          const keepNewspaperContext = savedNewspaperContext && !isLegacyGeneratedStudyText(savedNewspaperContext)
            ? savedNewspaperContext : '';
          const trio = buildUPSCExamples(item.words || 'Term', item.eng || '', cat, keepNewspaperContext);
          const savedMains = item.ex2 && !isLegacyGeneratedStudyText(item.ex2) ? item.ex2 : '';
          const savedPYQ = item.ex3 && !isLegacyGeneratedStudyText(item.ex3) ? item.ex3 : '';
          return {
            id: item.id || (Date.now() + Math.floor(Math.random() * 10000)),
            words: item.words || 'Unnamed',
            pos: item.pos || '',
            tamil: normalizeTamil(item.tamil || '—'),
            nuance: item.nuance || '',
            eng: item.eng || '',
            syn: item.syn || '—',
            cat: cat,
            starred: Boolean(item.starred),
            ex1: trio.ex1,
            ex2: savedMains || trio.ex2,
            ex3: savedPYQ || trio.ex3
          };
        });
      } catch (e) {
        return [];
      }
    }

    let db = loadDatabase();
    let brain = {};
    try {
      brain = JSON.parse(localStorage.getItem('cse_brain_v5') || localStorage.getItem('cse_learned_brain') || '{}') || {};
    } catch (e) { brain = {}; }

    let lookupHistory = [];
    try {
      lookupHistory = JSON.parse(localStorage.getItem('cse_lookup_history_v1') || '[]');
    } catch(e) { lookupHistory = []; }

    let selectedGS = 'ALL';
    let selectedLetter = 'ALL';
    let groupMode = 'gs';
    let onlyStarred = false;
    let expandAll = false;

    if (localStorage.getItem('cse_theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('cse_theme', next);
    }

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { el.style.display = 'none'; }, 4200);
    }

    function saveAll() {
      try {
        localStorage.setItem('cse_lexicon_v5', JSON.stringify(db));
        localStorage.setItem('cse_brain_v5', JSON.stringify(brain));
        localStorage.setItem('cse_lookup_history_v1', JSON.stringify(lookupHistory.slice(0, 20)));
      } catch (e) {
        console.warn('Storage quota warning:', e);
      }
    }

    function learnFromContext(word, definition, synonyms, targetGS) {
      const stop = new Set(['about','above','after','again','against','among','because','before','being','below','between','both','could','during','other','ought','shall','should','since','state','their','there','these','thing','those','through','under','until','where','which','while','would','person','action','process','practice','system']);
      const text = `${word} ${definition} ${synonyms}`.toLowerCase().replace(/[^a-z\s]/g, ' ');
      const tokens = text.split(/\s+/).filter(w => w.length >= 5 && !stop.has(w));
      tokens.slice(0, 7).forEach(tk => {
        brain[tk] = targetGS;
      });
      saveAll();
    }

    function buildUPSCExamples(word, def, gsPaper, newspaperContext = '') {
      const themes = {
        'GS-1: History & Heritage': {
          relevance: 'Use the term to explain historical processes, continuity and change, heritage, or the social consequences of historical developments.',
          pyq: 'Link it with PYQs on modern Indian history, cultural heritage, historical interpretation and the causes or consequences of major developments.'
        },
        'GS-1: Geography & Society': {
          relevance: 'Use it to analyse spatial patterns, human-environment interaction, population processes, regional disparities and their social effects.',
          pyq: 'Link it with PYQs on population, urbanisation, migration, regional development, resources and human geography.'
        },
        'GS-1: Society & Culture': {
          relevance: 'Use it to explain social structure, diversity, inequality, social change, inclusion and the interaction between institutions and communities.',
          pyq: 'Link it with PYQs on Indian society, diversity, women, population, poverty, urbanisation, communalism and social empowerment.'
        },
        'GS-2: Polity & Governance': {
          relevance: 'Use it to assess constitutional principles, institutional roles, accountability, transparency, public service delivery and governance outcomes.',
          pyq: 'Link it with PYQs on Parliament, the Executive, Judiciary, federalism, constitutional bodies, transparency and accountability.'
        },
        'GS-2: Social Justice': {
          relevance: 'Use it to assess access, equity, inclusion, welfare delivery and the outcomes of policies for vulnerable sections.',
          pyq: 'Link it with PYQs on health, education, poverty, hunger, vulnerable sections, welfare schemes and human resource development.'
        },
        'GS-2: International Relations': {
          relevance: 'Use it to analyse India’s bilateral and multilateral relations, strategic autonomy, regional interests and global institutions.',
          pyq: 'Link it with PYQs on neighbourhood relations, major powers, diaspora, international institutions and India’s foreign policy.'
        },
        'GS-3: Economy & Dev': {
          relevance: 'Use it to explain macroeconomic effects, resource mobilisation, growth, employment, inclusion, public finance and structural reforms.',
          pyq: 'Link it with PYQs on growth, inclusive development, budgeting, investment, employment, inflation, banking and external-sector issues.'
        },
        'GS-3: Agriculture': {
          relevance: 'Use it to discuss farm productivity, sustainability, markets, supply chains, irrigation, technology and farmers’ incomes.',
          pyq: 'Link it with PYQs on cropping patterns, irrigation, MSP, PDS, food processing, agricultural marketing and land reforms.'
        },
        'GS-3: Environment & Ecology': {
          relevance: 'Use it to assess ecological impacts, conservation, climate risks, environmental governance and sustainable development.',
          pyq: 'Link it with PYQs on biodiversity, pollution, environmental impact assessment, climate change, conservation and protected areas.'
        },
        'GS-3: Disaster Management': {
          relevance: 'Use it across disaster risk reduction, preparedness, early warning, response, recovery and resilient infrastructure.',
          pyq: 'Link it with PYQs on vulnerability, disaster preparedness, mitigation, institutional coordination and community-based disaster management.'
        },
        'GS-3: Science & Tech': {
          relevance: 'Use it to explain the application, opportunities, risks, regulation and societal implications of science and technology.',

        },
        'GS-3: Internal Security': {
          relevance: 'Use it to examine security threats, institutional capacity, technology, border management and the balance between security and rights.',
          pyq: 'Link it with PYQs on cyber security, terrorism, border management, organised crime, extremism and security agencies.'
        },
        'GS-4: Ethics & Integrity': {
          relevance: 'Use it to explain ethical principles, values in public service, impartiality, accountability and decision-making in administration.',
          pyq: 'Link it with PYQs and case studies on integrity, objectivity, empathy, probity, conflict of interest and ethical governance.'
        },
        'Essay & Editorial Idioms': {
          relevance: 'Use it as a precise concept or expression to strengthen an essay argument, provided it fits the context and is explained clearly.',
          pyq: 'Connect it to relevant essay themes and GS syllabus areas. Check the official UPSC question papers before treating any question as a PYQ.'
        }
      };
      const theme = themes[gsPaper] || themes['Essay & Editorial Idioms'];
      const suppliedContext = String(newspaperContext || '').trim();
      return {
        ex1: suppliedContext || 'No newspaper-specific context has been added for this term. Use Edit to paste a dated headline, article point or editorial extract; this field will not invent a newspaper reference.',
        ex2: `${word}: ${theme.relevance}`,
        ex3: `PYQ syllabus linkage (theme guidance, not a verbatim UPSC question): ${theme.pyq}`
      };
    }

    function classifyUPSC(word, def, syns) {
      const text = `${word} ${def} ${syns}`.toLowerCase();
      const tokens = text.replace(/[^a-z\s]/g, ' ').split(/\s+/);
      const scores = {};

      tokens.forEach(tk => {
        if (brain[tk]) {
          scores[brain[tk]] = (scores[brain[tk]] || 0) + 3;
        }
      });

      const rules = {
        'GS-2: Polity & Governance': /constitution|parliament|judiciary|supreme court|fundamental rights|directive principles|federal|ordinance|legislation|statute|repeal|abrogate|quash|mandate|tribunal|amendment|autonomy|bureaucracy|devolution|panchayat|censure|prerogative|franchise|grievance|ombudsman|accountability|executive|coalition|sovereignty|secular|bicameral|promulgate|jurisdiction|litigation|impunity|despotism|oligarchy|plebiscite|referendum|filibuster|gerrymander|adjudicate/,
        'GS-3: Economy & Dev': /fiscal|monetary|inflation|stagflation|deflation|liquidity|tariff|subsidy|revenue|deficit|gdp|macroeconomic|austerity|recession|capital|credit|bond|equity|trade|supply chain|monopoly|cartel|amortization|insolvency|conglomerate|remittance|fdi|disinvestment|protectionism|arbitrage|collateral|devaluation|exchequer|agrarian|msme|yield|solvency|moratorium|duopoly|windfall|securitization/,

        'GS-3: Environment & Ecology': /climate|carbon|biodiversity|ecology|emission|sequester|pollution|sustainable|conservation|habitat|endemic|biome|deforestation|afforestation|wetland|mangrove|anthropogenic|mitigation|adaptation|resilience|effluent|glacier|desertification|ecocide|rewilding|permafrost|decoupling|eutrophication|pelagic|riparian|cryosphere/,
        'GS-3: Science & Tech': /quantum|algorithm|cyber|encryption|biotech|genome|pathogen|semiconductor|nanotech|artificial intelligence|machine learning|blockchain|orbital|payload|nuclear|fission|fusion|indigenous|intellectual property|patent|spectrum|bandwidth|antimicrobial|crispr|deepfake|telemetry|cryptography|biometric|latency/,
        'GS-1: History & Heritage': /archaeology|heritage|civilization|dynasty|empire|inscription|monument|freedom struggle|national movement|colonial|renaissance|reform movement|medieval|ancient india|historical/,
        'GS-1: Geography & Society': /geography|monsoon|river basin|plateau|climate zone|population|urbanization|migration|demographic|settlement|resource distribution|regional disparity/,
        'GS-2: Social Justice': /social justice|welfare|inclusion|inclusive|poverty|healthcare|education|nutrition|vulnerable|marginalized|gender|sanitation|human development|inequality|empowerment/,
        'GS-3: Agriculture': /agriculture|agrarian|farmer|cropping|irrigation|agricultural|food security|food processing|minimum support price|crop insurance|soil health|fertilizer|farm income|horticulture|millet/,
        'GS-3: Disaster Management': /disaster|preparedness|early warning|earthquake|flood|cyclone|drought|landslide|resilience|mitigation|recovery|national disaster/,
        'GS-3: Internal Security': /internal security|terrorism|insurgency|left wing extremism|cybercrime|border security|radicalization|money laundering|organized crime|coastal security|smuggling|surveillance|encryption|naxal/,
        'GS-1: Society & Culture': /caste|patriarchy|kinship|demographic|urbanization|migration|secularism|communalism|regionalism|pluralism|marginalized|egalitarian|stratification|assimilation|sanskritization|subaltern|matriarch|syncretic|ethnocentrism|gentrification|fraternity|inequality|empowerment|endogamy|homogenization|parochial|ritual|religion|society/,
        'GS-4: Ethics & Integrity': /probity|integrity|altruism|empathy|compassion|conscience|moral|ethical|dilemma|impartiality|objectivity|non-partisanship|dedication|tolerance|virtue|utilitarian|deontology|rectitude|equanimity|fortitude|prudence|benevolence|magnanimity|scrupulous|corruption|nepotism|venality|mendacity|perfidy|altruistic/
      };

      for (const [gs, regex] of Object.entries(rules)) {
        const m = text.match(new RegExp(regex.source, 'g'));
        if (m) scores[gs] = (scores[gs] || 0) + m.length;
      }

      let best = 'Essay & Editorial Idioms';
      let max = 0;
      for (const [gs, sc] of Object.entries(scores)) {
        if (sc > max) { max = sc; best = gs; }
      }
      return best;
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 7000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function processSingleTerm(rawTerm, customNote, overrideGS) {
      const cleanWord = String(rawTerm || '').trim().replace(/\s+/g, ' ');
      if (!cleanWord) return null;

      let dictionaryEntries = [];
      let dictionaryResponse = null;

      // Use a real English dictionary entry. Never invent a definition.
      try {
        dictionaryResponse = await fetchWithTimeout(
          `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(cleanWord)}`,
          {}, 7000
        );
      } catch (error) {
        showToast('Dictionary lookup failed. Please check your connection and try again.');
        return { status: 'ERROR' };
      }

      if (!dictionaryResponse.ok) {
        // Suggest likely spellings; do not silently replace the user's word.
        let suggestions = [];
        try {
          const suggestionResponse = await fetchWithTimeout(
            `https://api.datamuse.com/words?sp=${encodeURIComponent(cleanWord)}&max=5`,
            {}, 5000
          );
          if (suggestionResponse.ok) {
            const data = await suggestionResponse.json();
            suggestions = Array.isArray(data)
              ? data.map(item => item.word).filter(Boolean).slice(0, 5)
              : [];
          }
        } catch (error) {}

        showToast(suggestions.length
          ? `“${cleanWord}” was not found. Did you mean: ${suggestions.join(', ')}?`
          : `“${cleanWord}” was not found in the English dictionary. Check the spelling.`);
        return { status: 'NOT_FOUND', suggestions };
      }

      try {
        const data = await dictionaryResponse.json();
        if (Array.isArray(data)) dictionaryEntries = data;
      } catch (error) {
        showToast('The dictionary returned an unreadable result. No entry was added.');
        return { status: 'ERROR' };
      }

      if (!dictionaryEntries.length) {
        showToast('No dictionary definition is available for this term. No entry was added.');
        return { status: 'NOT_FOUND' };
      }

      const dictionaryWord = dictionaryEntries[0].word || cleanWord;
      const definitions = [];
      const partsOfSpeech = [];
      const synonyms = [];
      let realExample = '';

      dictionaryEntries.forEach(entry => {
        (entry.meanings || []).forEach(meaning => {
          if (meaning.partOfSpeech && !partsOfSpeech.includes(meaning.partOfSpeech)) {
            partsOfSpeech.push(meaning.partOfSpeech);
          }
          (meaning.definitions || []).forEach(definition => {
            if (definition.definition && !definitions.includes(definition.definition)) {
              definitions.push(definition.definition);
            }
            if (!realExample && definition.example) realExample = definition.example;
            [...(meaning.synonyms || []), ...(definition.synonyms || [])].forEach(word => {
              if (word && !synonyms.includes(word)) synonyms.push(word);
            });
          });
        });
      });

      if (!definitions.length) {
        showToast(`No definition is available for “${dictionaryWord}”. No entry was added.`);
        return { status: 'NO_DEFINITION' };
      }

      // Translate the dictionary headword. This is machine translation, not a
      // certified dictionary equivalent; if unavailable, do not fabricate one.
      let tamilMeaning = '';
      try {
        const translationResponse = await fetchWithTimeout(
          `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ta&dt=t&ie=UTF-8&oe=UTF-8&q=${encodeURIComponent(dictionaryWord)}`,
          {}, 7000
        );
        if (translationResponse.ok) {
          const translationData = await translationResponse.json();
          tamilMeaning = normalizeTamil(
            (translationData?.[0] || []).map(part => part?.[0] || '').join('')
          );
        }
      } catch (error) {}

      if (!tamilMeaning) {
        showToast(`English dictionary definition found for “${dictionaryWord}”, but Tamil translation is unavailable. No incomplete entry was added.`);
        return { status: 'NO_TAMIL' };
      }

      const definitionText = definitions.join(' ');
      const synonymText = synonyms.slice(0, 8).join(', ');
      const detectedGS = (overrideGS && overrideGS !== 'AUTO')
        ? overrideGS
        : classifyUPSC(dictionaryWord, definitionText, synonymText);

      const existing = db.find(item =>
        String(item.words || '').split(',').some(word =>
          word.trim().toLowerCase() === dictionaryWord.toLowerCase()
        )
      );
      if (existing) return { status: 'EXISTS', item: existing };

      const newItem = {
        id: Date.now() + Math.floor(Math.random() * 10000),
        words: dictionaryWord,
        pos: partsOfSpeech.join(', ') || '',
        tamil: tamilMeaning,
        nuance: '',
        eng: definitionText,
        syn: synonymText || '—',
        cat: detectedGS,
        starred: false,
        // Restore all three UPSC study sections without inventing a newspaper citation or verbatim PYQ.
        ...buildUPSCExamples(dictionaryWord, definitionText, detectedGS)
      };

      db.push(newItem);
      learnFromContext(dictionaryWord, definitionText, synonymText, detectedGS);
      saveAll();
      showToast(`Dictionary entry added: “${dictionaryWord}”.`);
      return { status: 'ADDED', item: newItem };
    }

    async function submitWords() {
      const wInput = document.getElementById('wordInput');
      const nInput = document.getElementById('noteInput');
      const gsSelect = document.getElementById('gsOverride');
      const btn = document.getElementById('submitBtn');

      const raw = wInput ? wInput.value.trim() : '';
      if (!raw) return;

      const list = raw.split(',').map(w => w.trim()).filter(Boolean);
      if (btn) {
        btn.disabled = true;
        btn.textContent = `Indexing (${list.length})...`;
      }

      let lastResult = null;
      for (const w of list) {
        if (!lookupHistory.includes(w)) {
          lookupHistory.unshift(w);
        }
        lastResult = await processSingleTerm(w, nInput ? nInput.value.trim() : '', gsSelect ? gsSelect.value : 'AUTO');
        saveAll();
      }
      updateLookupHistoryUI();

      if (list.length > 1) {
        showToast(`Indexed ${list.length} terms into UPSC GS Syllabus categories.`);
      } else if (lastResult?.status === 'MERGED') {
        showToast(`Identical Tamil meaning ("${lastResult.item.tamil}") — Merged side-by-side: ${lastResult.item.words}`);
      } else if (lastResult?.status === 'EXISTS') {
        showToast(`"${lastResult.item.words}" is already indexed under ${lastResult.item.cat}.`);
      } else if (lastResult?.status === 'ADDED') {
        showToast(`Indexed "${lastResult.item.words}" (${lastResult.item.tamil}) ➔ ${lastResult.item.cat}`);
      }

      if (wInput) wInput.value = '';
      if (nInput) nInput.value = '';
      if (btn) {
        btn.disabled = false;
        btn.textContent = '+ Analyze & Index';
      }
      render();
    }

    async function chainSynonym(e, synWord, parentGS) {
      e.stopPropagation();
      const clean = synWord.trim();
      if (!clean || clean === '—') return;
      showToast(`Chaining synonym "${clean}"...`);
      const res = await processSingleTerm(clean, '', parentGS);
      if (res?.status === 'MERGED') {
        showToast(`Synonym "${clean}" shared the same Tamil meaning ("${res.item.tamil}") — Merged into: ${res.item.words}`);
      } else if (res?.status === 'ADDED') {
        showToast(`Indexed synonym "${clean}" (${res.item.tamil}) under ${res.item.cat}`);
      } else if (res?.status === 'EXISTS') {
        showToast(`"${clean}" is already in your lexicon.`);
      }
      render();
    }

    function saveEditedItem(e) {
      e.preventDefault();
      const id = document.getElementById('editItemId').value;
      const item = db.find(entry => String(entry.id) === id);
      if (!item) return;

      const oldCategory = item.cat;
      const oldExample2 = item.ex2;
      const oldExample3 = item.ex3;
      item.words = document.getElementById('editWords').value.trim() || item.words;
      item.pos = document.getElementById('editPos').value.trim();
      item.tamil = normalizeTamil(document.getElementById('editTamil').value) || '—';
      item.nuance = document.getElementById('editNuance').value.trim();
      item.cat = document.getElementById('editCategory').value;
      item.syn = document.getElementById('editSynonyms').value.trim() || '—';
      item.eng = document.getElementById('editDefinition').value.trim();
      item.ex1 = document.getElementById('editExample1').value.trim();
      item.ex2 = document.getElementById('editExample2').value.trim();
      item.ex3 = document.getElementById('editExample3').value.trim();

      if (oldCategory !== item.cat) {
        const categoryExamples = buildUPSCExamples(item.words, item.eng, item.cat, '');
        if (item.ex2 === oldExample2) item.ex2 = categoryExamples.ex2;
        if (item.ex3 === oldExample3) item.ex3 = categoryExamples.ex3;
        learnFromContext(item.words, item.eng, item.syn, item.cat);
      }
      saveAll();
      const modal = document.getElementById('editModal');
      if (modal && typeof modal.close === 'function') {
        modal.close();
      }
      showToast(`Saved changes to "${item.words}".`);
      render();
    }

              </div>
              <div class="ex-box">
                <div class="ex-head"><span>PYQ Linkage</span><span>Theme guidance</span></div>
                <div class="ex-body">${esc(item.ex3 || 'PYQ linkage has not been added yet. Verify exact questions against official UPSC papers.')}</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function render() {
      if (isInAdminPortal) return;
      renderSidebarAndAZ();

      const wordInputEl = document.getElementById('wordInput');
      const rawQ = wordInputEl ? wordInputEl.value.toLowerCase().trim() : '';
      const q = rawQ.includes(',') ? '' : rawQ;

      let filtered = db.filter(item => {
        const firstChar = item.words.trim().charAt(0).toUpperCase();
        const matchGS = selectedGS === 'ALL' || item.cat === selectedGS;
        const matchLet = selectedLetter === 'ALL' || firstChar === selectedLetter;
        const matchStar = !onlyStarred || item.starred;
        const matchQ = !q ||
          item.words.toLowerCase().includes(q) ||
          item.tamil.includes(q) ||
          (item.nuance && item.nuance.includes(q)) ||
          item.syn.toLowerCase().includes(q) ||
          item.eng.toLowerCase().includes(q);
        return matchGS && matchLet && matchStar && matchQ;
      });

      filtered.sort((a, b) => a.words.localeCompare(b.words));

      const body = document.getElementById('tableBody');
      const searchPanel = document.getElementById('searchResults');
      if (!body) return;

      // While searching, show only focused, fully expanded matches directly
      // beneath the search controls. The normal GS/alphabetical library remains
      // untouched and returns as soon as the search field is cleared.
      if (q) {
        body.style.display = 'none';
        if (searchPanel) {
          searchPanel.classList.add('active');
          if (!filtered.length) {
            searchPanel.innerHTML = `
              <div class="search-result-heading"><span>Search results</span><span>0 matches</span></div>
              <div style="padding:24px 18px; text-align:center; color:var(--ink-3); background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius);">
                <div style="font-weight:600; color:var(--ink-2); margin-bottom:5px;">No saved entry matches “${esc(rawQ)}”.</div>
                <div>Press Enter or select Analyze &amp; Index to look up this as a new word.</div>
              </div>`;
          } else {
            searchPanel.innerHTML = `
              <div class="search-result-heading"><span>Search results for “${esc(rawQ)}”</span><span>${filtered.length} ${filtered.length === 1 ? 'match' : 'matches'}</span></div>
              <div class="lex-grid-container">${filtered.map(item => buildRowHTML(item, true)).join('')}</div>`;
          }
        }
        return;
      }

      body.style.display = '';
      if (searchPanel) {
        searchPanel.classList.remove('active');
        searchPanel.innerHTML = '';
      }

      if (!filtered.length) {
        body.innerHTML = `
          <div style="padding:48px 20px; text-align:center; color:var(--ink-3); background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius);">
            <div style="font-size:14px; font-weight:600; color:var(--ink-2); margin-bottom:6px;">No vocabulary terms match your current filter.</div>
            <div style="font-size:13px;">Type any English word above or click <b>⚡ Load UPSC Starter Terms</b> in the left sidebar.</div>
          </div>`;
        return;
      }

      let html = '';
      if (groupMode === 'gs') {
        GS_CATEGORIES.forEach(gs => {
          const subList = filtered.filter(i => i.cat === gs);
          if (subList.length) {
            html += `<div class="section-divider"><span>${esc(gs)}</span><span>${subList.length} Terms</span></div>`;
            html += `<div class="lex-grid-container">` + subList.map(buildRowHTML).join('') + `</div>`;
          }
        });
      } else {
        let currentLetter = '';
        let currentGridOpen = false;
        filtered.forEach((item, idx) => {
          const ch = item.words.trim().charAt(0).toUpperCase();
          if (ch !== currentLetter) {
            if (currentGridOpen) {
              html += `</div>`;
            }
            currentLetter = ch;
            html += `<div class="section-divider"><span>Alphabetical Index — ${esc(ch)}</span></div>`;
            html += `<div class="lex-grid-container">`;
            currentGridOpen = true;
          }
          html += buildRowHTML(item);
          if (idx === filtered.length - 1 && currentGridOpen) {
            html += `</div>`;
          }
        });
      }
      body.innerHTML = html;
    }

    function exportCSV() {
      if (!db.length) return alert('Your lexicon is currently empty.');
      const sorted = [...db].sort((a, b) => a.cat.localeCompare(b.cat) || a.words.localeCompare(b.words));
      const headers = ['UPSC GS Paper', 'English Terms (A-Z)', 'Part of Speech', 'Exact Tamil Meaning', 'Tamil Nuances', 'UPSC Definition', 'Synonyms', 'Editorial Example', 'GS Mains Example', 'Way Forward Example'];
      const rows = sorted.map(i => [
        i.cat, i.words, i.pos, i.tamil, i.nuance, i.eng, i.syn, i.ex1, i.ex2, i.ex3
      ].map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(','));
      const blob = new Blob(['\uFEFF' + [headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'UPSC_CSE_Lexicon_Pro.csv';
      a.click();
    }

    function exportJSON() {
      const payload = { version: 5, exportedAt: new Date().toISOString(), db, brain };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'UPSC_Lexicon_Backup.json';
      a.click();
    }

    function importJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (Array.isArray(data.db)) {
            db = data.db;
            if (data.brain) brain = { ...brain, ...data.brain };
            saveAll();
            showToast(`Restored ${db.length} terms and learned rules!`);
            render();
          } else {
            alert('Invalid backup file format.');
          }
        } catch (err) {
          alert('Could not parse JSON backup file.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    render();
    updateLookupHistoryUI();
  </script>

  <!-- Firebase & Real-Time Cloud Sync Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-lexicon-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

    // Helper to sanitize any undefined values to prevent Firestore validation errors
    function sanitizeForFirestore(obj) {
      if (obj === undefined) return null;
      if (obj === null || typeof obj !== 'object') return obj;
      if (Array.isArray(obj)) {
        return obj.map(item => sanitizeForFirestore(item));
      }
      const sanitized = {};
      for (const key of Object.keys(obj)) {
        const val = obj[key];
        sanitized[key] = val === undefined ? null : sanitizeForFirestore(val);
      }
      return sanitized;
    }

    if (firebaseConfig) {
      const app = initializeApp(firebaseConfig);
      const dbInstance = getFirestore(app);
      const auth = getAuth(app);

      const initAuth = async () => {
        try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        } catch (e) {
          await signInAnonymously(auth);
        }
      };

      initAuth().then(() => {
        onAuthStateChanged(auth, (user) => {
          if (!user) return;
          const userId = user.uid;
          
          // Path per RULE 1: /artifacts/{appId}/users/{userId}/lexiconData
          const docRef = doc(dbInstance, 'artifacts', appId, 'users', userId, 'state', 'lexiconDocument');

          // Real-time synchronization listener across devices
          onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
              const cloudData = docSnap.data();
              if (Array.isArray(cloudData.db) && cloudData.db.length > 0) {
                window.db = cloudData.db;
                if (cloudData.brain) window.brain = { ...window.brain, ...cloudData.brain };
                localStorage.setItem('cse_lexicon_v5', JSON.stringify(window.db));
                localStorage.setItem('cse_brain_v5', JSON.stringify(window.brain));
                if (typeof render === 'function') render();
              }
            } else {
              const cleanDb = sanitizeForFirestore(window.db);
              const cleanBrain = sanitizeForFirestore(window.brain);
              setDoc(docRef, { db: cleanDb, brain: cleanBrain, updatedAt: new Date().toISOString() }, { merge: true }).catch(() => {});
            }
          }, (error) => {
            console.debug('Cloud sync sync snapshot note:', error);
          });

          // Override saveAll to sync to Firestore cloud storage with sanitization
          window._originalSaveAll = window.saveAll;
          window.saveAll = function() {
            if (window._originalSaveAll) window._originalSaveAll();
            if (!auth.currentUser) return;
            const cleanDb = sanitizeForFirestore(window.db);
            const cleanBrain = sanitizeForFirestore(window.brain);
            setDoc(docRef, {
              db: cleanDb,
              brain: cleanBrain,
              updatedAt: new Date().toISOString()
            }, { merge: true }).catch(err => console.warn('Cloud sync error:', err));
          };
        });
      });
    }
  </script>

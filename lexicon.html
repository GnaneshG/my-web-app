<!DOCTYPE html>
<html lang="ta" data-theme="light">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEXICON PRO — UPSC-CSE Editorial & Tamil Concordance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Tamil:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #f4f4f0;
      --bg-panel: #ffffff;
      --bg-subtle: #ebeae4;
      --bg-hover: #f9f9f6;
      --ink-1: #0f172a;
      --ink-2: #334155;
      --ink-3: #64748b;
      --border: #e2e0d8;
      --border-strong: #cbd5e1;
      --brand: #1e3a8a;
      --brand-soft: #dbeafe;
      --tamil: #065f46;
      --tamil-soft: #d1fae5;
      --gold: #b45309;
      --gold-soft: #fef3c7;
      --danger: #dc2626;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --radius: 6px;
    }

    [data-theme="dark"] {
      --bg-app: #090d16;
      --bg-panel: #111827;
      --bg-subtle: #1e293b;
      --bg-hover: #172033;
      --ink-1: #f8fafc;
      --ink-2: #cbd5e1;
      --ink-3: #94a3b8;
      --border: #1e293b;
      --border-strong: #334155;
      --brand: #60a5fa;
      --brand-soft: rgba(59, 130, 246, 0.15);
      --tamil: #34d399;
      --tamil-soft: rgba(16, 185, 129, 0.15);
      --gold: #fbbf24;
      --gold-soft: rgba(245, 158, 11, 0.15);
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: text; }
    body {
      background: var(--bg-app);
      color: var(--ink-1);
      font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', -apple-system, sans-serif;
      font-size: 13.5px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-strong);
      box-shadow: var(--shadow-sm);
    }
    .topbar-inner {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-group { display: flex; align-items: baseline; gap: 12px; }
    .brand-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: var(--ink-1);
    }
    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 2px 8px;
      background: var(--brand-soft);
      color: var(--brand);
      border-radius: 4px;
      font-weight: 600;
    }

    .action-cluster { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .back-site-btn { min-height: 34px; color: var(--brand); text-decoration: none; white-space: nowrap; }
    .back-site-btn:hover { border-color: var(--brand); background: var(--brand-soft); }
    .btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: var(--bg-panel);
      color: var(--ink-2);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.14s ease;
    }
    .btn:hover { background: var(--bg-subtle); color: var(--ink-1); }
    .btn.active { background: var(--ink-1); color: var(--bg-panel); border-color: var(--ink-1); }
    .btn-primary {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
      padding: 8px 18px;
      font-size: 13px;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:disabled { opacity: 0.55; cursor: wait; }

    .workspace {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 20px 24px 60px 24px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1024px) {
      .workspace { grid-template-columns: 1fr; padding: 12px; }
    }

    .sidebar {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      position: sticky;
      top: 72px;
    }
    @media (max-width: 1024px) {
      .sidebar { position: static; }
    }
    .side-heading {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--ink-3);
      margin: 8px 0 6px 4px;
      display: flex;
      justify-content: space-between;
    }
    .nav-list { display: flex; flex-direction: column; gap: 3px; }
    @media (max-width: 1024px) {
      .nav-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    }
    .nav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      border-radius: 5px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-2);
      cursor: pointer;
      border: none;
      background: transparent;
      text-align: left;
      white-space: nowrap;
      gap: 8px;
    }
    .nav-item:hover { background: var(--bg-subtle); color: var(--ink-1); }
    .nav-item.active {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 700;
    }
    .nav-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 99px;
      background: var(--bg-subtle);
      color: var(--ink-3);
    }
    .nav-item.active .nav-pill { background: var(--brand); color: #fff; }

    .brain-box {
      margin-top: 16px;
      padding: 12px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
    }
    .brain-title {
      font-weight: 700;
      color: var(--ink-1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .brain-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
      max-height: 110px;
      overflow-y: auto;
    }
    .brain-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--ink-2);
    }

    .main-stage { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

    .console-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }
    .input-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1.2fr) minmax(190px, 1fr) minmax(110px, auto) minmax(150px, auto);
      gap: 12px;
      align-items: stretch;
    }
    .input-grid > * { min-width: 0; }
    .input-grid button { justify-content: center; white-space: normal; }

    input, select {
      width: 100%;
      padding: 9px 12px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--ink-1);
      background: var(--bg-app);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      border-color: var(--brand);
      background: var(--bg-panel);
    }

    .az-ribbon {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .az-ribbon::-webkit-scrollbar { display: none; }
    .az-btn {
      min-width: 28px;
      height: 25px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--ink-3);
      cursor: pointer;
    }
    .az-btn:hover { background: var(--bg-subtle); color: var(--ink-1); }
    .az-btn.active { background: var(--ink-1); color: var(--bg-panel); }
    .az-btn.has-words { color: var(--brand); font-weight: 700; }
    .az-btn.active.has-words { color: var(--bg-panel); }

    #toastBanner {
      display: none;
      margin-top: 8px;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--tamil-soft);
      color: var(--tamil);
      border-left: 3px solid var(--tamil);
    }

    .table-box {
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: visible;
    }
    .col-headers {
      display: none;
    }

    .section-divider {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--brand);
      border-radius: var(--radius);
      margin: 16px 0 10px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lex-grid-container {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 1200px) {
      .lex-grid-container { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 768px) {
      .lex-grid-container { grid-template-columns: 1fr; }
    }

    .lex-item {
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .lex-item:hover { border-color: var(--brand); transform: translateY(-1px); }

    .lex-summary {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }

    .lex-summary-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .star-btn {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 15px;
      color: var(--border-strong);
      line-height: 1;
    }
    .star-btn.starred { color: var(--gold); }

    .c-word { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; flex: 1; }
    .w-main {
      font-weight: 700;
      font-size: 15px;
      color: var(--ink-1);
    }
    .w-merge-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--gold-soft);
      color: var(--gold);
      font-weight: 600;
    }
    .w-pos {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-size: 12.5px;
      color: var(--ink-3);
    }
    .spk-icon {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 12px;
      color: var(--ink-3);
      padding: 0 3px;
    }
    .spk-icon:hover { color: var(--brand); }

    .c-tamil-box {
      padding: 6px 10px;
      background: var(--tamil-soft);
      border-radius: 4px;
      border-left: 3px solid var(--tamil);
    }
    .c-tamil {
      font-family: 'Noto Sans Tamil', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      color: var(--tamil);
    }
    .t-nuance {
      font-weight: 400;
      font-size: 11.5px;
      color: var(--ink-2);
      display: block;
      margin-top: 2px;
    }

    body.recall-active .c-tamil-box,
    body.recall-active .c-def {
      filter: blur(5px);
      user-select: none;
      transition: filter 0.15s;
    }
    body.recall-active .lex-item:hover .c-tamil-box,
    body.recall-active .lex-item:hover .c-def,
    body.recall-active .lex-item.open .c-tamil-box,
    body.recall-active .lex-item.open .c-def {
      filter: none;
    }

    .c-def {
      font-size: 12.5px;
      color: var(--ink-2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .c-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      margin-top: 2px;
    }
    .gs-mini-select {
      padding: 3px 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
      background: var(--bg-app);
      color: var(--ink-2);
      width: auto;
      max-width: 140px;
      cursor: pointer;
    }
    .meta-actions { display: flex; align-items: center; gap: 4px; }
    .edit-row-btn {
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--bg-panel);
      color: var(--brand);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
    }
    .edit-row-btn:hover { background: var(--brand-soft); }
    .icon-del {
      border: none;
      background: none;
      color: var(--ink-3);
      cursor: pointer;
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 3px;
    }
    .icon-del:hover { color: var(--danger); background: rgba(220, 38, 38, 0.08); }

    .lex-drawer {
      display: none;
      padding: 14px;
      background: var(--bg-app);
      border-top: 1px dashed var(--border-strong);
    }
    .lex-item.open .lex-drawer { display: block; }
    .lex-item.open .c-def { display: block; overflow: visible; -webkit-line-clamp: unset; }

    .drawer-meta-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    @media (max-width: 760px) { .drawer-meta-grid { grid-template-columns: 1fr; } }

    .d-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--ink-3);
      margin-bottom: 4px;
    }
    .syn-clickable {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 9px;
      margin: 0 4px 4px 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--brand);
      cursor: pointer;
      transition: all 0.12s;
    }
    .syn-clickable:hover {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .ex-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    @media (max-width: 920px) { .ex-trio { grid-template-columns: 1fr; } }

    .ex-box {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-top: 2px solid var(--brand);
      padding: 10px 12px;
      border-radius: 4px;
    }
    .ex-box:nth-child(2) { border-top-color: var(--tamil); }
    .ex-box:nth-child(3) { border-top-color: var(--gold); }

    .ex-head {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    .ex-body {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink-1);
    }
    .c-word, .c-tamil, .c-def, .drawer-meta-grid, .ex-box { cursor: text; }

    .edit-modal {
      width: min(720px, calc(100% - 28px));
      max-height: min(90vh, 900px);
      padding: 0;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      background: var(--bg-panel);
      color: var(--ink-1);
      box-shadow: 0 24px 80px rgba(15, 23, 42, .3);
    }
    .edit-modal::backdrop { background: rgba(15, 23, 42, .58); backdrop-filter: blur(3px); }
    .edit-modal-inner { padding: 24px; }
    .edit-modal h2 { margin-bottom: 6px; font-size: 22px; }
    .edit-modal p { margin-bottom: 18px; color: var(--ink-3); }
    .edit-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .edit-form-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
    .edit-form-grid .wide { grid-column: 1 / -1; }
    .edit-form-grid textarea {
      width: 100%;
      min-height: 100px;
      padding: 11px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      background: var(--bg-app);
      color: var(--ink-1);
      font: inherit;
      line-height: 1.55;
      resize: vertical;
    }
    .edit-form-grid textarea:focus { border-color: var(--brand); background: var(--bg-panel); outline: none; }
    .edit-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <span class="brand-title" id="pageMainTitle">The CSE Lexicon</span>
        <span class="brand-tag" id="pageSubtitle">GS-I to GS-IV Concordance</span>
      </div>
      <div class="action-cluster" id="mainHeaderActions">
        <a class="btn back-site-btn" id="back-to-website" href="./index.html" aria-label="Return to the main website">← Back to Website</a>
        <button class="btn active" id="btnViewGS" onclick="setGrouping('gs')">📂 GS Syllabus</button>
        <button class="btn" id="btnViewAZ" onclick="setGrouping('az')">🔤 A–Z Index</button>
        <button class="btn" id="btnStarFilter" onclick="toggleStarFilter()">★ High-Yield Only</button>
        <button class="btn" id="btnRecall" onclick="toggleRecallMode()">🎯 Active Recall</button>
        <button class="btn" id="btnExpandAll" onclick="toggleExpandAll()">↕️ Expand All</button>
        <button class="btn" id="btnToggleAdmin" onclick="toggleAdminPortal()">⚙️ Admin Portal</button>
        <button class="btn" id="btnThemeMain" onclick="toggleTheme()" title="Switch Theme">🌗</button>
      </div>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="mainSidebar">
      <div class="side-heading">
        <span id="sidebarHeaderTitle">UPSC GS Syllabus</span>
        <span id="totalBadge">0</span>
      </div>
      <div class="nav-list" id="sidebarNav"></div>

      <div class="brain-box">
        <div class="brain-title">
          <span>🧠 Adaptive GS Brain</span>
          <span id="brainCount" style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--brand);">0 Rules</span>
        </div>
        <div style="color:var(--ink-3); font-size:11.5px; line-height:1.4;">
          Automatically learns domain stems from UPSC PYQ trends, The Hindu & Indian Express editorials.
        </div>
        <div class="brain-tags" id="brainPreview"></div>
      </div>

      <div style="margin-top:12px; display:flex; gap:6px;">
        <button class="btn" style="width:100%; justify-content:center;" onclick="loadStarterPack()">⚡ Load UPSC Starter Terms</button>
      </div>
    </aside>

    <main class="main-stage" id="mainStageArea">
      <section class="console-card">
        <div class="input-grid">
          <input type="text" id="wordInput" placeholder="Search lexicon or enter English word(s)..." oninput="handleSearchInput()" onkeydown="if(event.key==='Enter') submitWords()" />
          <input type="text" id="noteInput" placeholder="Optional: Custom Tamil/English meaning..." onkeydown="if(event.key==='Enter') submitWords()" />
          <select id="gsOverride">
            <option value="AUTO">⚡ Auto-Detect GS Paper</option>
            <option value="GS-1: Society & Culture">GS-1: Society & Culture</option>
            <option value="GS-2: Polity & Governance">GS-2: Polity & Governance</option>
            <option value="GS-2: International Relations">GS-2: Int. Relations</option>
            <option value="GS-3: Economy & Dev">GS-3: Economy & Dev</option>
            <option value="GS-3: Environment & Ecology">GS-3: Environment</option>
            <option value="GS-3: Science & Tech">GS-3: Science & Tech</option>
            <option value="GS-4: Ethics & Integrity">GS-4: Ethics & Integrity</option>
            <option value="GS-1: History & Heritage">GS-1: History & Heritage</option>
            <option value="GS-1: Geography & Society">GS-1: Geography & Society</option>
            <option value="GS-2: Social Justice">GS-2: Social Justice</option>
            <option value="GS-3: Agriculture">GS-3: Agriculture</option>
            <option value="GS-3: Disaster Management">GS-3: Disaster Management</option>
            <option value="GS-3: Internal Security">GS-3: Internal Security</option>
            <option value="Essay & Editorial Idioms">Essay & Editorial Idioms</option>
          </select>

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeTamil(str) {
      return String(str || '')
        .replace(/[\u200B-\u200D\uFEFF]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function loadDatabase() {
      const raw = localStorage.getItem('cse_lexicon_v5')
        || localStorage.getItem('cse_lexicon_v4')
        || localStorage.getItem('upsc_vocab_v3')
        || localStorage.getItem('upsc_vocab_db')
        || '[]';
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.map(item => {
          let cat = item.cat || 'Essay & Editorial Idioms';
          if (cat === 'Polity & Governance') cat = 'GS-2: Polity & Governance';
          else if (cat === 'Economy') cat = 'GS-3: Economy & Dev';
          else if (cat === 'International Relations') cat = 'GS-2: International Relations';
          else if (cat === 'Environment') cat = 'GS-3: Environment & Ecology';
          else if (cat === 'Science & Tech') cat = 'GS-3: Science & Tech';
          else if (cat === 'Society') cat = 'GS-1: Society & Culture';
          else if (cat === 'Ethics') cat = 'GS-4: Ethics & Integrity';
          else if (!GS_CATEGORIES.includes(cat)) cat = 'Essay & Editorial Idioms';

          const trio = buildUPSCExamples(item.words || 'Term', item.eng || '', cat, item.ex1 || item.ex || '');
          return {
            id: item.id || (Date.now() + Math.floor(Math.random() * 10000)),
            words: item.words || 'Unnamed',
            pos: item.pos || '',
            tamil: normalizeTamil(item.tamil || '—'),
            nuance: item.nuance || '',
            eng: item.eng || '',
            syn: item.syn || '—',
            cat: cat,
            starred: Boolean(item.starred),
            ex1: item.ex1 || trio.ex1,
            ex2: item.ex2 || trio.ex2,
            ex3: item.ex3 && !item.ex3.includes('Essay & Ethics Way Forward:') ? item.ex3 : trio.ex3
          };
        });
      } catch (e) {
        return [];
      }
    }

      window._toastTimer = setTimeout(() => { el.style.display = 'none'; }, 4200);

    async function fetchWithTimeout(url, options = {}, timeoutMs = 5500) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: ctrl.signal });
        clearTimeout(id);
        return res;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    function learnFromContext(word, definition, synonyms, targetGS) {
      const stop = new Set(['about','above','after','again','against','among','because','before','being','below','between','both','Could','during','other','ought','shall','should','since','state','their','there','these','thing','those','through','under','until','where','which','while','would','person','action','process','practice','system']);
      const text = `${word} ${definition} ${synonyms}`.toLowerCase().replace(/[^a-z\s]/g, ' ');
      const tokens = text.split(/\s+/).filter(w => w.length >= 5 && !stop.has(w));
      tokens.slice(0, 7).forEach(tk => {
        brain[tk] = targetGS;
      });
      saveAll();
    }

    function classifyUPSC(word, def, syns) {
      const text = `${word} ${def} ${syns}`.toLowerCase();
      const tokens = text.replace(/[^a-z\s]/g, ' ').split(/\s+/);
      const scores = {};

      tokens.forEach(tk => {
        if (brain[tk]) {
          scores[brain[tk]] = (scores[brain[tk]] || 0) + 4;
        }
      });

      // Precise UPSC CSE Syllabus Rulebook & Keyword Stems
      const rules = {
        'GS-1: History & Heritage': /archaeology|heritage|civilization|dynasty|empire|inscription|monument|freedom struggle|national movement|colonial|renaissance|reform movement|medieval|ancient india|historical|temple|sculpture|vedic|mauryan|gupta|mughal|sufi|bhakti|chronicle|manuscript|dynastic|archival|silt|paleolithic|neolithic/,

      };

      for (const [gs, regex] of Object.entries(rules)) {
        const m = text.match(new RegExp(regex.source, 'g'));
        if (m) scores[gs] = (scores[gs] || 0) + m.length;
      }

      let best = 'Essay & Editorial Idioms';
      let max = 0;
      for (const [gs, sc] of Object.entries(scores)) {
        if (sc > max) { max = sc; best = gs; }
      }
      return best;
    }

    async function processSingleTerm(rawTerm, customNote, overrideGS) {
      const cleanWord = rawTerm.trim();
      if (!cleanWord) return null;

      let exactTamil = '';
      let nuances = [];
      let engDef = customNote;
      let pos = '';
      let syns = [];
      let realEx = '';

      try {
        const gtUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ta&dt=t&dt=bd&dt=md&dt=ex&dt=ss&ie=UTF-8&oe=UTF-8&q=${encodeURIComponent(cleanWord)}`;
        const gtRes = await fetchWithTimeout(gtUrl, {}, 5000);
        if (gtRes.ok) {
          const gt = await gtRes.json();
          if (!exactTamil && gt[0]?.[0]?.[0]) {
            exactTamil = normalizeTamil(gt[0][0][0]);
          }
          if (!nuances.length && gt[1]?.[0]?.[1]) {
            nuances = gt[1][0][1].slice(0, 4).map(normalizeTamil);
          }
          if (!engDef && gt[12]?.[0]?.[1]?.[0]?.[0]) {
            engDef = gt[12][0][1][0][0];
          }
          if (!pos && gt[12]?.[0]?.[0]) {
            pos = gt[12][0][0];
          }
          if (!syns.length) {
            if (gt[11]?.[0]?.[1]?.[0]?.[0]) syns = gt[11][0][1][0][0].slice(0, 6);
            else if (gt[1]?.[0]?.[2]) syns = gt[1][0][2].flatMap(x => x[1] || []).slice(0, 6);
          }
          if (!realEx && gt[13]?.[0]?.[0]?.[0]) {
            realEx = gt[13][0][0][0].replace(/<\/?b>/g, '');
          }
        }
      } catch (e) {}

      if (!engDef || syns.length < 2 || !realEx) {
        try {
          const dRes = await fetchWithTimeout(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(cleanWord)}`, {}, 4500);
          if (dRes.ok) {
            const dJson = await dRes.json();
            const m = dJson[0]?.meanings?.[0];
            if (m) {
              if (!pos) pos = m.partOfSpeech || '';
              if (!engDef && m.definitions?.[0]?.definition) engDef = m.definitions[0].definition;
              if (!realEx) {
                const exItem = m.definitions?.find(d => d.example);
                if (exItem) realEx = exItem.example;
              }
              const extraSyns = [...(m.synonyms || []), ...(m.definitions?.[0]?.synonyms || [])];
              syns = [...new Set([...syns, ...extraSyns])].slice(0, 6);
            }
          }
        } catch (e) {}
      }

      const formattedWord = cleanWord.charAt(0).toUpperCase() + cleanWord.slice(1);

      for (let item of db) {
        const existingList = item.words.split(',').map(w => w.trim().toLowerCase());
        if (existingList.includes(cleanWord.toLowerCase())) {
          return { status: 'EXISTS', item };
        }
        if (exactTamil && exactTamil !== '—' && exactTamil !== '-' && normalizeTamil(item.tamil) === exactTamil) {
          const mergedWords = [...new Set([...item.words.split(',').map(w => w.trim()), formattedWord])]
            .sort((a, b) => a.localeCompare(b));
          item.words = mergedWords.join(', ');
          if (customNote && !item.eng.includes(customNote)) {
            item.eng += ` | ${customNote}`;
          }
          if (syns.length) {
            const mergedSyns = [...new Set([...item.syn.split(',').map(s => s.trim()).filter(s => s && s !== '—'), ...syns])].slice(0, 8);
            item.syn = mergedSyns.join(', ') || '—';
          }
          saveAll();
          return { status: 'MERGED', item };
        }
      }

      const detectedGS = (overrideGS && overrideGS !== 'AUTO')
        ? overrideGS
        : classifyUPSC(cleanWord, engDef, syns.join(' '));

      learnFromContext(cleanWord, engDef, syns.join(' '), detectedGS);

      const finalDef = engDef || `Editorial term synonymous with ${syns.slice(0, 3).join(', ') || formattedWord}`;
      const examples = buildUPSCExamples(formattedWord, finalDef, detectedGS, realEx);

      const newItem = {
        id: Date.now() + Math.floor(Math.random() * 10000),
        words: formattedWord,
        pos: pos || 'term',
        tamil: exactTamil || '—',
        nuance: nuances.filter(n => n !== exactTamil).join(', '),
        eng: finalDef,
        syn: syns.join(', ') || '—',
        cat: detectedGS,
        starred: false,
        ex1: examples.ex1,
        ex2: examples.ex2,
        ex3: examples.ex3
      };

      db.push(newItem);
      saveAll();
      return { status: 'ADDED', item: newItem };
    }

    async function triggerAiLookup() {
      const wInput = document.getElementById('wordInput');
      const word = wInput.value.trim().split(',')[0].trim();
      if (!word) {
        showToast('Enter an English term before starting a lookup.');
        wInput.focus();
        return;
      }

      const aiBtn = document.getElementById('aiBtn');
      const noteInput = document.getElementById('noteInput');
      const gsSelect = document.getElementById('gsOverride');
      aiBtn.disabled = true;
      aiBtn.textContent = 'Looking up…';
      showToast(`Analyzing "${word}" with AI & UPSC editorial concordance...`);

      try {
        const res = await fetchWithTimeout(SECURE_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            word,
            category: gsSelect.value === 'AUTO' ? null : gsSelect.value
          })
        }, 4000);

        if (res.ok) {
          const rawText = await res.text();
          let data = JSON.parse(rawText);
          let payload = data.result;
          if (typeof payload === 'string') {
            payload = JSON.parse(payload.replace(/```json/g, '').replace(/```/g, '').trim());
          }
          if (payload.definition) noteInput.value = payload.definition;
          if (payload.tamil) wInput.dataset.autoTamil = payload.tamil;
          if (gsSelect.value === 'AUTO' && GS_CATEGORIES.includes(payload.category)) {
            gsSelect.value = payload.category;
          }
          showToast(`✨ AI Lookup successful for "${word}"!`);
          return;
        }
      } catch (err) {}

      try {
        const [transRes, dictRes] = await Promise.allSettled([
          fetchWithTimeout(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ta&dt=t&ie=UTF-8&oe=UTF-8&q=${encodeURIComponent(word)}`, {}, 5000),
          fetchWithTimeout(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`, {}, 5000)
        ]);

        let tVal = '';
        let dVal = '';
        if (transRes.status === 'fulfilled' && transRes.value.ok) {
          const trJson = await transRes.value.json();
          tVal = normalizeTamil(trJson?.[0]?.[0]?.[0] || '');
        }
        if (dictRes.status === 'fulfilled' && dictRes.value.ok) {
          const dJson = await dictRes.value.json();
          dVal = dJson?.[0]?.meanings?.[0]?.definitions?.[0]?.definition || '';
        }

        if (dVal) noteInput.value = dVal;
        if (tVal) wInput.dataset.autoTamil = tVal;
        if (gsSelect.value === 'AUTO') gsSelect.value = classifyUPSC(word, dVal, '');

        showToast(`✨ Successfully fetched definition and Tamil meaning for "${word}".`);
      } catch (e2) {
        showToast('Lookup completed. You can adjust the definition and click Analyze & Index.');
      } finally {
        aiBtn.disabled = false;
        aiBtn.textContent = '✨ AI Lookup';
      }
    }

    async function submitWords() {
      const wInput = document.getElementById('wordInput');
      const nInput = document.getElementById('noteInput');
      const gsSelect = document.getElementById('gsOverride');
      const btn = document.getElementById('submitBtn');

      const raw = wInput.value.trim();
      if (!raw) return;

      const list = raw.split(',').map(w => w.trim()).filter(Boolean);
      btn.disabled = true;
      btn.textContent = `Indexing (${list.length})...`;

      let lastResult = null;
      for (const w of list) {
        lastResult = await processSingleTerm(w, nInput.value.trim(), gsSelect.value);
        if (wInput.dataset.autoTamil && lastResult?.item) {
          lastResult.item.tamil = wInput.dataset.autoTamil;
          delete wInput.dataset.autoTamil;
          saveAll();
        }
      }

      if (list.length > 1) {
        showToast(`Indexed ${list.length} terms into UPSC GS Syllabus categories.`);
      } else if (lastResult?.status === 'MERGED') {
        showToast(`Identical Tamil meaning ("${lastResult.item.tamil}") — Merged side-by-side: ${lastResult.item.words}`);
      } else if (lastResult?.status === 'EXISTS') {
        showToast(`"${lastResult.item.words}" is already indexed under ${lastResult.item.cat}.`);
      } else if (lastResult?.status === 'ADDED') {
        showToast(`Indexed "${lastResult.item.words}" (${lastResult.item.tamil}) ➔ ${lastResult.item.cat}`);
      }

      wInput.value = '';
      nInput.value = '';
      btn.disabled = false;
      btn.textContent = '+ Analyze & Index';
      render();
    }

    async function chainSynonym(e, synWord, parentGS) {
      e.stopPropagation();
      const clean = synWord.trim();
      if (!clean || clean === '—') return;
      showToast(`Chaining synonym "${clean}"...`);
      const res = await processSingleTerm(clean, '', parentGS);
      if (res?.status === 'MERGED') {
        showToast(`Synonym "${clean}" shared the same Tamil meaning ("${res.item.tamil}") — Merged into: ${res.item.words}`);
      } else if (res?.status === 'ADDED') {
        showToast(`Indexed synonym "${clean}" (${res.item.tamil}) under ${res.item.cat}`);
      } else if (res?.status === 'EXISTS') {
        showToast(`"${clean}" is already in your lexicon.`);
      }
      render();
    }

    function saveEditedItem(e) {
      e.preventDefault();
      const id = document.getElementById('editItemId').value;
      const item = db.find(entry => String(entry.id) === id);
      if (!item) return;

      const oldCategory = item.cat;
      const oldExample2 = item.ex2;
      const oldExample3 = item.ex3;
      item.words = document.getElementById('editWords').value.trim() || item.words;
      item.pos = document.getElementById('editPos').value.trim();
      item.tamil = normalizeTamil(document.getElementById('editTamil').value) || '—';
      item.nuance = document.getElementById('editNuance').value.trim();
      item.cat = document.getElementById('editCategory').value;
      item.syn = document.getElementById('editSynonyms').value.trim() || '—';
      item.eng = document.getElementById('editDefinition').value.trim();
      item.ex1 = document.getElementById('editExample1').value.trim();
      item.ex2 = document.getElementById('editExample2').value.trim();
      item.ex3 = document.getElementById('editExample3').value.trim();

      if (oldCategory !== item.cat) {
        const categoryExamples = buildUPSCExamples(item.words, item.eng, item.cat, '');
        if (item.ex2 === oldExample2) item.ex2 = categoryExamples.ex2;
        if (item.ex3 === oldExample3) item.ex3 = categoryExamples.ex3;
        learnFromContext(item.words, item.eng, item.syn, item.cat);
      }
      saveAll();
      document.getElementById('editModal').close();
      showToast(`Saved changes to "${item.words}".`);
      render();
    }

      const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
      const azBar = document.getElementById('azBar');
      if (azBar) {
        azBar.innerHTML = letters.map(l => {
          const has = l !== 'ALL' && activeInitials.has(l);
          return `<button class="az-btn ${selectedLetter === l ? 'active' : ''} ${has ? 'has-words' : ''}" onclick="selectedLetter='${l}';render()">${l}</button>`;
        }).join('');
      }
    }

    function thirdExampleLabel(category) {
      if (category.startsWith('GS-1:')) return 'GS-1 Analysis';
      if (category === 'GS-2: International Relations') return 'GS-2 IR Strategy';
      if (category.startsWith('GS-2:')) return 'GS-2 Policy Response';
      if (category.startsWith('GS-3:')) return 'GS-3 Way Forward';
      if (category.startsWith('GS-4:')) return 'GS-4 Ethical Response';
      return 'Essay Strategy';
    }

    function buildRowHTML(item) {
      const wordGroup = item.words.split(',').map(w => w.trim()).filter(Boolean);
      const mergeBadge = wordGroup.length > 1
        ? `<span class="w-merge-count" title="Merged English words sharing identical Tamil meaning">${wordGroup.length} Merged</span>`
        : '';

      const synList = (item.syn && item.syn !== '—' && item.syn !== '-')
        ? item.syn.split(',').map(s => s.trim()).filter(Boolean)
        : [];

      const synButtons = synList.length
        ? synList.map(s => `<button class="syn-clickable" onclick="chainSynonym(event, '${esc(s)}', '${esc(item.cat)}')" title="Click to translate & index '${esc(s)}'">+ ${esc(s)}</button>`).join('')
        : '<span style="color:var(--ink-3)">—</span>';

      const gsOptions = GS_CATEGORIES.map(c => {
        const short = c.replace(': Society & Culture', ' Society').replace(': History & Heritage', ' History').replace(': Geography & Society', ' Geography').replace(': Polity & Governance', ' Polity').replace(': Social Justice', ' Social Justice').replace(': International Relations', ' IR').replace(': Economy & Dev', ' Economy').replace(': Agriculture', ' Agriculture').replace(': Environment & Ecology', ' Env').replace(': Disaster Management', ' Disaster').replace(': Science & Tech', ' S&T').replace(': Internal Security', ' Security').replace(': Ethics & Integrity', ' Ethics').replace('Essay & Editorial Idioms', 'Essay');
        return `<option value="${esc(c)}" ${item.cat === c ? 'selected' : ''}>${esc(short)}</option>`;
      }).join('');

      return `
        <div class="lex-item ${expandAll ? 'open' : ''}" onclick="handleSummaryClick(event, this)">
          <div class="lex-summary">
            <div class="lex-summary-top">
              <button class="star-btn ${item.starred ? 'starred' : ''}" onclick="toggleStar(event, ${item.id})" title="Mark High-Yield">★</button>
              <div class="c-word">
                <span class="w-main">${esc(item.words)}</span>
                ${mergeBadge}
                ${item.pos ? `<span class="w-pos">${esc(item.pos)}</span>` : ''}
                <button class="spk-icon" onclick="speakText(event, '${esc(item.words)}')" title="Pronounce">🔊</button>
              </div>
            </div>
            
            <div class="c-tamil-box" lang="ta">
              <div class="c-tamil">${esc(item.tamil)}</div>
              ${item.nuance ? `<span class="t-nuance">${esc(item.nuance)}</span>` : ''}
            </div>

            <div class="c-def">${esc(item.eng)}</div>

            <div class="c-meta" onclick="event.stopPropagation()">
              <select class="gs-mini-select" onchange="changeGS(event, ${item.id}, this.value)" title="Reassign GS Paper">
                ${gsOptions}
              </select>
              <div class="meta-actions">
                <button class="edit-row-btn" onclick="editItem(event, ${item.id})" title="Edit this entry">Edit</button>
                <button class="icon-del" onclick="deleteRow(event, ${item.id})" title="Delete">✕</button>
              </div>
            </div>
          </div>

          <div class="lex-drawer" onclick="event.stopPropagation()">
            <div class="drawer-meta-grid">
              <div>
                <div class="d-label">UPSC Mains Definition</div>
                <div style="color:var(--ink-1); font-weight:500;">${esc(item.eng)}</div>
              </div>
              <div>
                <div class="d-label">Interactive Synonyms (Click any to index)</div>
                <div>${synButtons}</div>
              </div>
            </div>

            <div class="ex-trio">
              <div class="ex-box">
                <div class="ex-head"><span>The Hindu / IE Editorial</span><span>Context</span></div>
                <div class="ex-body">"${esc(item.ex1)}"</div>
              </div>
              <div class="ex-box">
                <div class="ex-head"><span>UPSC-CSE PYQ Mains</span><span>Answer Body</span></div>
                <div class="ex-body">"${esc(item.ex2)}"</div>
              </div>
              <div class="ex-box">
                <div class="ex-head"><span>Official Source &amp; PYQ Trend</span><span>Way Forward</span></div>
                <div class="ex-body">"${esc(item.ex3)}"</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function render() {
      if (isInAdminPortal) return;
      renderSidebarAndAZ();

      const wordInputEl = document.getElementById('wordInput');
      const rawQ = wordInputEl ? wordInputEl.value.toLowerCase().trim() : '';
      const q = rawQ.includes(',') ? '' : rawQ;

      let filtered = db.filter(item => {
        const firstChar = item.words.trim().charAt(0).toUpperCase();
        const matchGS = selectedGS === 'ALL' || item.cat === selectedGS;
        const matchLet = selectedLetter === 'ALL' || firstChar === selectedLetter;
        const matchStar = !onlyStarred || item.starred;
        const matchQ = !q ||
          item.words.toLowerCase().includes(q) ||
          item.tamil.includes(q) ||
          (item.nuance && item.nuance.includes(q)) ||
          item.syn.toLowerCase().includes(q) ||
          item.eng.toLowerCase().includes(q);
        return matchGS && matchLet && matchStar && matchQ;
      });

      filtered.sort((a, b) => a.words.localeCompare(b.words));

      const body = document.getElementById('tableBody');
      if (!body) return;

      if (!filtered.length) {
        body.innerHTML = `
          <div style="padding:48px 20px; text-align:center; color:var(--ink-3); background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius);">
            <div style="font-size:14px; font-weight:600; color:var(--ink-2); margin-bottom:6px;">No vocabulary terms match your current filter.</div>
            <div style="font-size:13px;">Type any English word above or click <b>⚡ Load UPSC Starter Terms</b> in the left sidebar.</div>
          </div>`;
        return;
      }

      let html = '';
      if (groupMode === 'gs') {
        GS_CATEGORIES.forEach(gs => {
          const subList = filtered.filter(i => i.cat === gs);
          if (subList.length) {
            html += `<div class="section-divider"><span>${esc(gs)}</span><span>${subList.length} Terms</span></div>`;
            html += `<div class="lex-grid-container">` + subList.map(buildRowHTML).join('') + `</div>`;
          }
        });
      } else {
        let currentLetter = '';
        let currentGridOpen = false;
        filtered.forEach((item, idx) => {
          const ch = item.words.trim().charAt(0).toUpperCase();
          if (ch !== currentLetter) {
            if (currentGridOpen) {
              html += `</div>`;
            }
            currentLetter = ch;
            html += `<div class="section-divider"><span>Alphabetical Index — ${esc(ch)}</span></div>`;
            html += `<div class="lex-grid-container">`;
            currentGridOpen = true;
          }
          html += buildRowHTML(item);
          if (idx === filtered.length - 1 && currentGridOpen) {
            html += `</div>`;
          }
        });
      }
      body.innerHTML = html;
    }

    function exportCSV() {
      if (!db.length) return alert('Your lexicon is currently empty.');
      const sorted = [...db].sort((a, b) => a.cat.localeCompare(b.cat) || a.words.localeCompare(b.words));
      const headers = ['UPSC GS Paper', 'English Terms (A-Z)', 'Part of Speech', 'Exact Tamil Meaning', 'Tamil Nuances', 'UPSC Definition', 'Synonyms', 'Editorial Example', 'GS Mains Example', 'Way Forward Example'];
      const rows = sorted.map(i => [
        i.cat, i.words, i.pos, i.tamil, i.nuance, i.eng, i.syn, i.ex1, i.ex2, i.ex3
      ].map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(','));
      const blob = new Blob(['\uFEFF' + [headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'UPSC_CSE_Lexicon_Pro.csv';
      a.click();
    }

    function exportJSON() {
      const payload = { version: 5, exportedAt: new Date().toISOString(), db, brain };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'UPSC_Lexicon_Backup.json';
      a.click();
    }

    function importJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (Array.isArray(data.db)) {
            db = data.db;
            if (data.brain) brain = { ...brain, ...data.brain };
            saveAll();
            showToast(`Restored ${db.length} terms and learned rules!`);
            render();
          } else {
            alert('Invalid backup file format.');
          }
        } catch (err) {
          alert('Could not parse JSON backup file.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    render();
  </script>
</body>
</html>
